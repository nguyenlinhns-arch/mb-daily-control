name: Publish the correctly dated daily report at midnight Vietnam

on:
  schedule:
    # GitHub cron uses UTC. 17:00 UTC = 00:00 on the next calendar day in Vietnam.
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      lock_date:
        description: "Ngày dữ liệu đã khóa YYYY-MM-DD; để trống dùng ngày hôm qua tại Việt Nam"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: completed-draw-report-pipeline
  cancel-in-progress: false

jobs:
  publish-correct-calendar-day:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
      TZ: Asia/Ho_Chi_Minh
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install locked parser dependency
        run: python -m pip install --disable-pip-version-check openpyxl==3.1.5

      - name: Resolve yesterday in Vietnam
        env:
          MANUAL_DATE: ${{ github.event.inputs.lock_date || '' }}
        run: |
          set -euo pipefail
          if [[ -n "${MANUAL_DATE:-}" ]]; then
            [[ "$MANUAL_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || exit 2
            target="$MANUAL_DATE"
          else
            target="$(date -d 'yesterday' +%F)"
          fi
          echo "LOCK_DATE=$target" >> "$GITHUB_ENV"

      - name: Publish only the report for the new real calendar day
        run: |
          set -euo pipefail
          for attempt in {1..6}; do
            if python scripts/update_completed_draw_report.py --draw-date "$LOCK_DATE"; then
              exit 0
            fi
            if [[ "$attempt" -eq 6 ]]; then
              echo "Không đủ nguồn đối chiếu; giữ nguyên báo cáo cũ và không gắn nhầm ngày."
              exit 1
            fi
            echo "Nguồn chưa sẵn sàng; thử lại sau 5 phút ($attempt/6)."
            sleep 300
          done

      - name: Validate date integrity and public boundary
        run: |
          python scripts/update_completed_draw_report.py --self-test
          npm test
          git diff --check

      - name: Commit the correctly dated report
        run: |
          set -euo pipefail
          git config user.name "mb-daily-report-automation"
          git config user.email "actions@users.noreply.github.com"
          git add data/history-27.bz2.b64 data/source-access.json \
            data/completed-draw-audit.json site-v2/index.html site-v2/mau-bao-cao.html
          if git diff --cached --quiet; then
            echo "The correctly dated report is already published."
            exit 0
          fi
          git commit -m "auto: publish report using locked data $LOCK_DATE"
          git pull --rebase origin main
          git push origin HEAD:main
