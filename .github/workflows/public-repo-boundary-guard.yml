name: Guard public repository boundary

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with previous commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Permanently forbid third-party display runtime
        run: |
          set -euo pipefail
          test ! -e site-v2/monetization-slots.js
          test ! -e scripts/inject_monetization.py
          python - <<'PY'
          from pathlib import Path
          forbidden = (
              "effective" + "cpmnetwork.com",
              "high" + "performanceformat.com",
              "Ad" + "sterra",
              "pl308" + "63058",
              "b3caa" + "39744fc30610e7756cf4ccb98cd",
              "e336b" + "428517bbcb55a3e3da308cc7939",
          )
          roots = [Path('site-v2')]
          builders = (
              Path('scripts/apply_conversion_site.py'),
              Path('scripts/apply_conversion_v2.py'),
              Path('scripts/apply_home_portal_safe.py'),
              Path('scripts/build_statistics_site.py'),
              Path('scripts/sitewide_product_surface.py'),
          )
          files = []
          for root in roots:
              files.extend(path for path in root.rglob('*') if path.is_file())
          files.extend(path for path in builders if path.is_file())
          hits = []
          for path in files:
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              for token in forbidden:
                  if token.lower() in text.lower():
                      hits.append(f"{path}: forbidden display-runtime token")
          if hits:
              raise SystemExit('\n'.join(hits))
          print('THIRD_PARTY_DISPLAY_RUNTIME_PERMANENTLY_FORBIDDEN_OK')
          PY

      - name: Core privacy and builder self-tests
        run: |
          set -euo pipefail
          test ! -e site-v2/monetization-slots.js
          test ! -e scripts/inject_monetization.py
          test ! -e .github/workflows/accesstrade-only-monetization.yml
          test ! -e scripts/enforce_accesstrade_only.py
          python scripts/public_repo_boundary_guard.py --self-test
          python scripts/public_repo_boundary_guard.py
          python scripts/apply_home_portal_safe.py --self-test
          python scripts/bundle_portal_css.py --self-test
          python scripts/fingerprint_portal_assets.py --self-test
          python scripts/share_statistics_loader.py --self-test
          python scripts/enrich_portal_metadata.py --self-test
          python scripts/optimize_monetization_placement.py --self-test
          python scripts/optimize_seo_ads_v1.py --self-test
          python scripts/finalize_portal_v4.py --self-test
          python scripts/sitewide_product_surface.py --self-test
          python scripts/indexnow_submit.py --self-test
          node tests/commerce-policy-smoke.mjs

      - name: Frontend syntax
        run: |
          set -euo pipefail
          node --check site-v2/portal-v2.js
          node --check site-v2/ads-tracking.js
          node --check site-v2/finance-banner.js
          node --check site-v2/finance-gate-sitewide.js
          node --check site-v2/affiliate-visibility.js
          node --check site-v2/checkout-enhance.js
          node --check site-v2/checkout-entry.js
          node --check site-v2/copy-lock.js

      - name: Statistics and SEO runtime contract
        run: |
          set -euo pipefail
          grep -Fq 'xsmb_lookup_compare' site-v2/portal-v2.js
          grep -Fq 'web_vitals_summary' site-v2/portal-v2.js
          grep -Fq 'lm_analytics_consent_v1' site-v2/portal-v2.js
          grep -Fq 'xsmb_history_date_open' site-v2/portal-v2.js
          grep -Fq "'/xsmb-30-ngay/'" site-v2/portal-v2.js
          grep -Fq "'/nguon-du-lieu-xsmb/'" site-v2/portal-v2.js
          grep -Fq 'const dataRoutes=' site-v2/portal-v2.js
          grep -Fq 'data-google-ads-landing' scripts/optimize_seo_ads_v1.py
          grep -Fq 'MONETIZATION_TOKENS' scripts/optimize_seo_ads_v1.py
          grep -Fq 'portal-number-compare' site-v2/portal-v3.css
          grep -Fq 'portal-history-codes' site-v2/portal-v3.css
          ! grep -Fq 'statistics-data.json' site-v2/checkout-entry.js

      - name: Canonical Shopee four-card contract
        run: |
          set -euo pipefail
          grep -Fq 'class="lm-shop-grid"' scripts/sitewide_product_surface.py
          grep -Fq 'class="lm-shop-item"' scripts/sitewide_product_surface.py
          grep -Fq 'data-sitewide-products="true"' scripts/sitewide_product_surface.py
          grep -Fq 'data-affiliate-static-placement="after_tools"' scripts/sitewide_product_surface.py
          grep -Fq '/go/shopee/?p=' scripts/sitewide_product_surface.py
          grep -Fq 'display:block!important;visibility:visible!important;opacity:1!important' scripts/sitewide_product_surface.py
          grep -Fq 'affiliate_product_grid_view' scripts/sitewide_product_surface.py
          grep -Fq 'affiliate_product_click' scripts/sitewide_product_surface.py
          ! grep -Fq 'go.isclix.com' site-v2/checkout-enhance.js site-v2/finance-banner.js site-v2/affiliate-visibility.js
          ! grep -Fq 'function addDirectShopeeDeals' site-v2/checkout-enhance.js
          ! grep -Fq 'function setupShopeeNudge' site-v2/checkout-enhance.js
          ! grep -Fq 'function installAffiliateFallback' site-v2/finance-banner.js
          ! grep -Fq 'function installStrip' site-v2/affiliate-visibility.js
          echo CANONICAL_SHOPEE_FOUR_CARD_GUARD_OK

      - name: AI conversion funnel contract
        run: |
          set -euo pipefail
          grep -Fq 'MỞ BẢN PHÂN TÍCH AI' site-v2/finance-banner.js
          grep -Fq '30.000đ' site-v2/finance-banner.js
          grep -Fq 'ai_checkout_intent' site-v2/finance-banner.js
          grep -Fq 'ai_checkout_open' site-v2/finance-banner.js
          grep -Fq 'ai_payment_qr_view' site-v2/finance-banner.js
          grep -Fq 'ai_payment_claim_submit' site-v2/finance-banner.js
          grep -Fq 'lm_ai_purchase_intent_v1' site-v2/finance-banner.js
          grep -Fq 'Gợi ý số cho ngày hôm nay' site-v2/finance-banner.js
          ! grep -Fq 'Khi cần phần kết luận riêng cho ngày' site-v2/finance-banner.js
          echo AI_FUNNEL_GUARD_OK

      - name: VPBank sitewide finance contract
        run: |
          set -euo pipefail
          f=site-v2/finance-gate-sitewide.js
          grep -Fq 'const MIN_DELAY_MS = 3000' "$f"
          grep -Fq 'const MIN_SCROLL_RATIO = 0.08' "$f"
          grep -Fq 'lm_vpbank_banner_closed_v3' "$f"
          grep -Fq 'early_finance_banner_sitewide_v3' "$f"
          grep -Fq 'lm-sponsor-vp' "$f"
          grep -Fq 'Vay tiền online' "$f"
          grep -Fq 'Đóng quảng cáo' "$f"
          grep -Fq 'data-go-vpbank' "$f"
          grep -Fq 'affiliate_finance_view' "$f"
          grep -Fq 'affiliate_finance_click' "$f"
          grep -Fq 'affiliate_finance_close' "$f"
          grep -Fq 'closeOffer("checkout_open", false)' "$f"
          grep -Fq 'closeOffer("checkout_intent", false)' "$f"
          ! grep -Fq 'COOLDOWN_MS' "$f"
          ! grep -Fq '24h' "$f"
          ! grep -Fq 'href="https://go.isclix.com' "$f"
          echo VPBANK_SITEWIDE_CANONICAL_GUARD_OK
