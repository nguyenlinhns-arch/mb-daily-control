name: Update completed XSMB report at 19:00 Vietnam

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/completed-draw-daily-1900.yml"
      - "scripts/normalize_history_pack.py"
      - "scripts/update_completed_draw_report.py"
      - "scripts/build_public_snapshot.py"
      - "tests/ai-data-site-smoke.mjs"
  schedule:
    # GitHub cron uses UTC. 12:00 UTC = 19:00 Asia/Ho_Chi_Minh.
    - cron: "0 12 * * *"
    # Safe fallback in case the primary scheduled run is delayed or sources are not ready.
    - cron: "30 12 * * *"
    # Final recovery window: keep the completed-draw audit from remaining stale overnight.
    - cron: "0 13 * * *"
    # Late recovery window for providers that finish publishing after 20:00 Vietnam.
    - cron: "45 13 * * *"
  workflow_dispatch:
    inputs:
      draw_date:
        description: "Ngày đã công bố YYYY-MM-DD; để trống dùng kỳ gần nhất đã hoàn tất"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: completed-draw-report-pipeline
  # A newer fallback run supersedes an older retry loop for the same completed date.
  cancel-in-progress: true

jobs:
  crosscheck-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
      TZ: Asia/Ho_Chi_Minh
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install locked parser dependency
        run: python -m pip install --disable-pip-version-check openpyxl==3.1.5

      - name: Refresh resilient Minh Ngoc mirror route
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/build_public_snapshot.py")
          text = path.read_text(encoding="utf-8")
          old = 'https://www.minhngoc.net.vn/ket-qua-xo-so/mien-bac/{dmy}.html'
          new = 'https://www.minhngoc.com.vn/kqxs/mien-bac/{dmy}.html'
          if old not in text:
              raise SystemExit("Expected legacy Minh Ngoc route not found; review source routing before continuing")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Resolve completed draw date
        env:
          MANUAL_DATE: ${{ github.event.inputs.draw_date || '' }}
        run: |
          set -euo pipefail
          if [[ -n "${MANUAL_DATE:-}" ]]; then
            [[ "$MANUAL_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || exit 2
            target="$MANUAL_DATE"
          else
            hour="$(date +%H)"
            if ((10#$hour < 19)); then
              target="$(date -d 'yesterday' +%F)"
            else
              target="$(date +%F)"
            fi
          fi
          echo "DRAW_DATE=$target" >> "$GITHUB_ENV"

      - name: Normalize and validate history container
        run: |
          set -euo pipefail
          python scripts/normalize_history_pack.py --self-test
          python scripts/normalize_history_pack.py

      - name: Resolve missing completed-draw audit dates
        run: |
          set -euo pipefail
          AUDIT_DATES="$(python - <<'PY'
          import json
          import os
          from datetime import date, timedelta

          target = date.fromisoformat(os.environ['DRAW_DATE'])
          source = json.load(open('data/source-access.json', encoding='utf-8'))
          audit = json.load(open('data/completed-draw-audit.json', encoding='utf-8'))
          source_end = date.fromisoformat(str(source['history_end']))
          start = target if target <= source_end else source_end + timedelta(days=1)

          # Current audit schema stores completed dates in an `audits` array and
          # `latest_completed_draw` as an object. Keep backward compatibility with
          # the older optional `draws` mapping so recovery does not re-audit every
          # date on each scheduled run.
          audited_dates = set(str(k) for k in (audit.get('draws', {}) or {}).keys())
          for item in (audit.get('audits') or []):
              if isinstance(item, dict) and item.get('date'):
                  audited_dates.add(str(item['date']))

          latest_obj = audit.get('latest_completed_draw')
          if isinstance(latest_obj, dict):
              latest_date = str(latest_obj.get('date') or '')
          else:
              latest_date = str(latest_obj or '')

          dates = []
          cursor = start
          while cursor <= target:
              key = cursor.isoformat()
              if key not in audited_dates:
                  dates.append(key)
              cursor += timedelta(days=1)

          # update_audit() records latest_completed_draw as the processed target.
          # When older gaps are backfilled, verify the requested target last so
          # the pointer remains monotonic. If the audit is already complete and
          # already points at the target, skip network re-checks and avoid churn.
          target_key = target.isoformat()
          target_missing = target_key not in audited_dates
          dates = [key for key in dates if key != target_key]
          if target_missing or dates or latest_date != target_key:
              dates.append(target_key)
          print(' '.join(dates))
          PY
          )"
          echo "AUDIT_DATES=$AUDIT_DATES" >> "$GITHUB_ENV"
          if [[ -z "$AUDIT_DATES" ]]; then
            echo "Audit already complete and current through $DRAW_DATE."
          else
            echo "Completed audit sequence: $AUDIT_DATES"
          fi

      - name: Cross-check completed draws into isolated audit stage
        run: |
          set -euo pipefail
          for draw in $AUDIT_DATES; do
            completed=0
            for attempt in {1..6}; do
              if python scripts/update_completed_draw_report.py --draw-date "$draw" --stage-only; then
                completed=1
                break
              fi
              if [[ "$attempt" -eq 6 ]]; then
                echo "Không đủ nguồn đối chiếu cho $draw sau 6 lần; giữ nguyên production."
                exit 1
              fi
              echo "Nguồn $draw chưa sẵn sàng; thử lại sau 5 phút ($attempt/6)."
              sleep 300
            done
            [[ "$completed" -eq 1 ]] || exit 1
          done

      - name: Restore source route after isolated audit stage
        run: git restore --source=HEAD -- scripts/build_public_snapshot.py

      - name: Keep public history on the currently published lock
        run: |
          set -euo pipefail
          # The 19:00 job proves completed draws and records audits only.
          # Public history/source/report advance together in the 00:05 pipeline,
          # preventing a transient stats-ahead-of-report deployment mismatch.
          git restore --source=HEAD -- data/history-27.bz2.b64

      - name: Validate fail-closed public boundary
        run: |
          set -euo pipefail
          python -m py_compile scripts/update_completed_draw_report.py scripts/build_public_snapshot.py scripts/normalize_history_pack.py
          python scripts/normalize_history_pack.py --self-test
          npm test
          ! grep -niE 'hôm nay đánh|chốt số|số đẹp|bao lô|xiên|cam kết trúng|mở kết luận|15\.000' \
            site-v2/index.html site-v2/mau-bao-cao.html
          ! grep -R -Ei '(canonical|final)[_-]?(codes|pairs)' site-v2 ai-methods data/public-historical-proof.json --include='*.html' --include='*.json'
          git diff --check

      - name: Publish audited completed-draw update
        run: |
          set -euo pipefail
          git config user.name "mb-completed-draw-automation"
          git config user.email "actions@users.noreply.github.com"
          git add data/completed-draw-audit.json
          if git diff --cached --quiet; then
            echo "Completed draw audit already published."
            exit 0
          fi
          git commit -m "auto: audit completed draws through $DRAW_DATE"
          git pull --rebase origin main
          git push origin HEAD:main
