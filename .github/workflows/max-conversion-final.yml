name: Maximize 4SO conversion funnel
on:
  push:
    paths: ['.github/workflows/max-conversion-final.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Optimize first-screen conversion
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('ai-methods/landing-v3.html')
          s=p.read_text(encoding='utf-8')

          # Add immediate CTA inside the 80% proof block.
          old='''<section class="top-proof wrap" aria-label="Kết quả kiểm định lịch sử"><div class="top-proof-copy"><span class="top-proof-label">KIỂM ĐỊNH LỊCH SỬ 30 NGÀY</span><strong>80%</strong><div><b>24/30 ngày</b><span>có ít nhất một đầu ra xuất hiện</span></div></div><p>Số liệu lịch sử đã đối chiếu · Không bảo đảm kỳ tiếp theo</p></section>'''
          new='''<section class="top-proof wrap" aria-label="Kết quả kiểm định lịch sử"><div class="top-proof-copy"><span class="top-proof-label">KIỂM ĐỊNH LỊCH SỬ 30 NGÀY</span><strong>80%</strong><div><b>24/30 ngày</b><span>có ít nhất một đầu ra xuất hiện</span></div></div><p>Số liệu lịch sử đã đối chiếu · Không bảo đảm kỳ tiếp theo</p><div class="top-proof-actions"><button type="button" data-open>ĐĂNG KÝ TỪ 30.000đ</button><a href="#mau-bao-cao">Xem mẫu báo cáo</a></div></section>'''
          s=s.replace(old,new)

          # Remove duplicated start-date row: date already appears in the kicker and modal.
          s=s.replace('<div class="date-row"><span>Ngày bắt đầu</span><strong><span data-date>--/--/----</span></strong></div>','')

          # Make the low-friction one-day option clearly the starting point.
          s=s.replace('<button class="package active" type="button" data-package="day"><b>1 ngày</b><strong>30.000đ</strong><small>01 báo cáo</small></button>', '<button class="package active" type="button" data-package="day"><span class="start-badge">BẮT ĐẦU TỪ ĐÂY</span><b>1 ngày</b><strong>30.000đ</strong><small>01 báo cáo · thanh toán một lần</small></button>')
          s=s.replace('<button class="modal-package active" type="button" data-package="day"><b>1 ngày</b><strong>30.000đ</strong><small>01 báo cáo</small></button>', '<button class="modal-package active" type="button" data-package="day"><b>1 ngày</b><strong>30.000đ</strong><small>01 báo cáo</small></button>')

          # Mobile sticky bar carries the proof + low entry price continuously.
          s=s.replace('<div class="mobile"><div><span>Báo cáo XSMB · từ <span data-date>--/--/----</span></span><strong>Gói từ 30.000đ</strong></div><button type="button" data-open>Đăng ký</button></div>', '<div class="mobile"><div><span>80% lịch sử · Báo cáo XSMB</span><strong>Từ 30.000đ</strong></div><button type="button" data-open>Đăng ký</button></div>')

          css='''.top-proof-actions{margin-top:11px;display:grid;grid-template-columns:1fr auto;gap:8px}.top-proof-actions button,.top-proof-actions a{min-height:46px;border-radius:12px;font-size:11px;font-weight:900}.top-proof-actions button{padding:0 13px;border:0;background:var(--navy);color:#fff}.top-proof-actions a{padding:0 12px;border:1px solid rgba(7,27,43,.18);display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.55);color:var(--navy)}.start-badge{position:absolute;top:-8px;left:6px;padding:3px 6px;border-radius:999px;background:var(--lime);color:var(--navy)!important;font-size:7px!important;font-weight:900;white-space:nowrap}.package[data-package="day"]{padding-top:14px}'''
          if '.top-proof-actions{' not in s:
              s=s.replace('    @media(max-width:420px)', '    '+css+'\n    @media(max-width:420px)')

          # On mobile, show the purchase box immediately after 80% proof; explanatory copy follows.
          mobile='''\n    @media(max-width:819px){.hero>.sell{order:1}.hero>div:first-child{order:2}.sell{display:flex;flex-direction:column}.sell .buy{order:1;margin-top:0}.sell .proof-mini{order:2;margin-top:10px}.top-proof-actions{grid-template-columns:1fr 1fr}.hero{padding-top:16px}.buy-kicker{font-size:10px}.buy h2{font-size:25px}.packages{margin-top:2px}}\n'''
          if '@media(max-width:819px)' not in s:
              s=s.replace('    @media(max-width:420px)', mobile+'    @media(max-width:420px)')

          # Top proof CTA interaction can be tracked separately when a pixel is installed.
          if 'TopProofCTA' not in s:
              target="document.querySelector('a[href=\"#mau-bao-cao\"]')?.addEventListener('click',()=>track('ViewReportSample',{report_date:start}));"
              repl=target+"document.querySelector('.top-proof-actions button')?.addEventListener('click',()=>track('TopProofCTA',{report_date:start,price:30000}));"
              s=s.replace(target,repl)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify
        run: |
          grep -n 'top-proof-actions' ai-methods/landing-v3.html | head
          grep -n 'BẮT ĐẦU TỪ ĐÂY' ai-methods/landing-v3.html
          grep -n '80% lịch sử · Báo cáo XSMB' ai-methods/landing-v3.html
          grep -n '@media(max-width:819px)' ai-methods/landing-v3.html
      - name: Commit
        run: |
          if git diff --quiet -- ai-methods/landing-v3.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai-methods/landing-v3.html
          git commit -m 'Shorten mobile conversion path'
          git push origin HEAD:main
