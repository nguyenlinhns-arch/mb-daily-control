name: Deploy Lê Miền Bắc MB_ALL to GitHub Pages

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "data/live-deploy-status.json"
  workflow_dispatch:
  schedule:
    - cron: "1 17 * * *"
    - cron: "15 18 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Validate MB_ALL lock
        id: report
        shell: bash
        run: |
          set -euo pipefail
          REPORT_DATE="$(python - <<'PY'
          import json
          from datetime import date, timedelta

          public = json.load(open('ai-methods/public-methods.json', encoding='utf-8'))
          ready = json.load(open('data/paid-report-ready.json', encoding='utf-8'))
          source = json.load(open('data/source-access.json', encoding='utf-8'))
          target = date.fromisoformat(str(public['target_date']))
          lock = date.fromisoformat(str(public['data_lock']))

          if lock != target - timedelta(days=1):
              raise SystemExit('MB_ALL data lock is not T-1')
          if int(public.get('mb_all', {}).get('method_count_run', 0)) != 31:
              raise SystemExit('MB_ALL did not run 31/31 methods')
          if ready.get('report_date') != target.isoformat() or ready.get('data_lock') != lock.isoformat():
              raise SystemExit('Paid readiness does not match MB_ALL target/data lock')
          if source.get('history_end') != lock.isoformat():
              raise SystemExit('Source history_end does not match MB_ALL data lock')
          if ready.get('delivery_policy') != 'REVEAL_ONLY_AFTER_OWNER_EMAIL_APPROVAL':
              raise SystemExit('Delivery policy must require owner email approval')
          print(target.isoformat())
          PY
          )"
          echo "date=${REPORT_DATE}" >> "$GITHUB_OUTPUT"
          echo "Rendering MB_ALL portal for ${REPORT_DATE}"

      - name: Build final portal
        env:
          REPORT_DATE: ${{ steps.report.outputs.date }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/ai-methods

          # Use the maintained checkout template directly. The retired
          # build_seo_pages V2 validator is intentionally not called because
          # the production payload is MB_ALL V3 with 31 methods.
          cp -f site-v2/index.html _site/index.html
          find site-v2 -maxdepth 1 -type f \( -name '*.css' -o -name '*.js' -o -name '*.svg' -o -name '*.png' -o -name '*.webmanifest' \) -exec cp -f {} _site/ \;
          cp -f site-v2/404.html _site/
          cp -f site-v2/legal.html _site/
          cp -f site-v2/mau-bao-cao.html _site/
          cp -f site-v2/robots.txt _site/
          cp -f ai-methods/seo.css _site/ai-methods/
          cp -f ai-methods/og-4so-ai-v2.jpg _site/ai-methods/
          cp -f data/source-access.json _site/
          cp -f data/public-historical-proof.json _site/historical-proof.json
          cp -f data/paid-report-ready.json _site/report-readiness.json

          # The source template still contains a retired sticky mobile checkout
          # outside <main>. apply_home_portal creates the two canonical checkout
          # buttons itself, so remove the obsolete third button first.
          python - <<'PY'
          from pathlib import Path
          import re

          page = Path('_site/index.html')
          text = page.read_text(encoding='utf-8')
          text, removed = re.subn(
              r'\s*<button\b(?=[^>]*class="[^"]*mobile-cta[^"]*")(?=[^>]*data-open-checkout)[^>]*>.*?</button>',
              '',
              text,
              count=1,
              flags=re.I | re.S,
          )
          if removed != 1:
              raise SystemExit('Retired mobile checkout was not found exactly once')
          page.write_text(text, encoding='utf-8')
          PY

          python scripts/build_statistics_site.py --output-root _site
          python scripts/apply_home_portal.py --output-root _site
          python scripts/optimize_portal_v2.py --output-root _site

          if ! python scripts/optimize_portal_v3.py --output-root _site; then
            echo '::warning::Skipped optional portal-v3 enhancement'
          fi
          if ! python scripts/apply_portal_v3_assets.py --output-root _site; then
            echo '::warning::Skipped optional portal asset enhancement'
          fi
          if ! python scripts/sitewide_product_surface.py --output-root _site; then
            echo '::warning::Skipped optional affiliate product surface'
          fi

          # Absolute final writer. No later content transform may restore the
          # 70%/4SO block, six public number cards or Zalo purchase CTA.
          python scripts/finalize_live_mball.py --output-root _site

          touch _site/.nojekyll
          printf 'lemienbac.com\n' > _site/CNAME

      - name: Verify exact public blocks
        shell: bash
        run: |
          set -euo pipefail
          test -s _site/index.html
          test -s _site/app.js
          test -s _site/config.js
          test -s _site/copy-lock.js
          test -s _site/mball-live-status.json
          test -s _site/phuong-phap-cong-khai/index.html
          grep -q 'MBALL_LIVE_FINAL_V3' _site/index.html
          grep -q 'MB_ALL chạy đủ 31 phương pháp mỗi ngày' _site/index.html
          grep -q 'THANH TOÁN NHẬN GỢI Ý SỐ · 30.000Đ' _site/index.html
          grep -q 'Xác nhận thanh toán qua email' _site/index.html
          grep -q 'id="mball-zalo-support"' _site/index.html

          python - <<'PY'
          from pathlib import Path
          import html, re

          page = Path('_site/index.html').read_text(encoding='utf-8')
          visible = re.sub(r'<!--.*?-->', ' ', page, flags=re.S)
          visible = re.sub(r'<script\b.*?</script>', ' ', visible, flags=re.I | re.S)
          visible = re.sub(r'<style\b.*?</style>', ' ', visible, flags=re.I | re.S)
          visible = html.unescape(re.sub(r'<[^>]+>', ' ', visible, flags=re.S))
          visible = re.sub(r'\s+', ' ', visible)

          for token in (
              'KIỂM ĐỊNH LỊCH SỬ 4SO',
              '4SO chỉ công khai hiệu quả tổng hợp',
              'MỞ ZALO – NHẬN GỢI Ý HÔM NAY',
          ):
              assert token.lower() not in visible.lower(), token

          for token in (
              'MB_ALL chạy đủ 31 phương pháp mỗi ngày',
              '3–5–7–10',
              'HOT/COLD',
              'PRE-DRAW',
              'THANH TOÁN NHẬN GỢI Ý SỐ · 30.000Đ',
              'Xác nhận thanh toán qua email',
          ):
              assert token.lower() in visible.lower(), token

          overview = page.split('data-mball-method-overview="mball-31-live-v3"', 1)[1].split('</section>', 1)[0]
          for token in ('portal-method-numbers', 'portal-ball', 'portal-consensus'):
              assert token not in overview, token
          assert page.count('data-open-checkout') >= 2
          print('MBALL_LIVE_SURFACE_VERIFIED')
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Record successful lemienbac.com deployment
        env:
          REPORT_DATE: ${{ steps.report.outputs.date }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          payload = {
              'status': 'DEPLOYED_PASS',
              'website': 'https://lemienbac.com/',
              'page_url': os.environ.get('PAGE_URL', ''),
              'report_date': os.environ['REPORT_DATE'],
              'source_commit': os.environ['GITHUB_SHA'],
              'deployed_at_utc': datetime.now(timezone.utc).isoformat(),
              'surface': 'MBALL_31_LIVE_V3',
              'paid_checkout': True,
              'email_confirmation': True,
              'zalo_support_only': True,
              'legacy_70_removed': True,
              'public_six_method_outputs_removed': True
          }
          Path('data/live-deploy-status.json').write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8'
          )
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/live-deploy-status.json
          git commit -m 'ops: record successful live MB_ALL deployment [skip ci]'
          git push
