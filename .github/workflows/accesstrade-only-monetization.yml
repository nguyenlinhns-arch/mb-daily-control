name: Guard ACCESSTRADE-only monetization

on:
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/accesstrade-only-monetization.yml'
      - 'scripts/apply_portal_v3_assets.py'
      - 'scripts/optimize_monetization_placement.py'
      - 'site-v2/checkout-enhance.js'
      - 'site-v2/finance-banner.js'
  pull_request:
    branches: ["main"]
    paths:
      - 'scripts/apply_portal_v3_assets.py'
      - 'scripts/optimize_monetization_placement.py'
      - 'site-v2/checkout-enhance.js'
      - 'site-v2/finance-banner.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify ACCESSTRADE-only contract
        run: |
          set -euo pipefail
          python scripts/apply_portal_v3_assets.py --self-test
          python scripts/optimize_monetization_placement.py --self-test
          grep -q 'go.isclix.com/deep_link' site-v2/checkout-enhance.js
          grep -q 'go.isclix.com/deep_link' site-v2/finance-banner.js
          grep -q 'Vay tiền nhanh online' site-v2/finance-banner.js
          ! grep -q 'Phê duyệt và hồ sơ bổ sung' site-v2/finance-banner.js
          ! grep -Eiq 'effectivecpmnetwork\.com|highperformanceformat\.com|lm-adsterra|adsterra-native|adsterra-banner' scripts/apply_portal_v3_assets.py scripts/optimize_monetization_placement.py
          echo ACCESSTRADE_ONLY_OK
