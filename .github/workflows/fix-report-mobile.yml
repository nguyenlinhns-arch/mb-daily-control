name: Polish MB 4SO report mobile

on:
  push:
    paths:
      - '.github/workflows/fix-report-mobile.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Polish report header on mobile
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('ai-methods/report.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('.tool.primary{border-color:var(--navy);background:var(--navy);color:#fff}', '.tool.primary{border-color:var(--navy);background:var(--navy);color:#fff}.print-short{display:none}')
          s=s.replace('@media(max-width:520px){.tools .print-label{display:none}', '@media(max-width:520px){#copyCodes{display:none}.tools .print-label{display:none}.print-short{display:inline}')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit polish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai-methods/report.html
          git diff --cached --quiet && exit 0
          git commit -m 'Polish MB 4SO report mobile header'
          git push origin HEAD:main
