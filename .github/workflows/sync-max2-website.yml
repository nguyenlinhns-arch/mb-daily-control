name: Sync MB ALL review to website

on:
  workflow_dispatch:
  schedule:
    - cron: "7 0-17 * * *"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/sync-max2-website.yml"
      - "scripts/sync_max2_website.py"

permissions:
  contents: write

concurrency:
  group: "max2-website-daily-sync"
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install workbook reader
        run: python -m pip install --disable-pip-version-check openpyxl==3.1.5

      - name: Validate sync logic
        run: |
          set -euo pipefail
          python scripts/build_public_methods.py --self-test
          python scripts/sync_max2_website.py --self-test

      - name: Download canonical Google Sheet
        env:
          GOOGLE_SHEET_ID: 1iVAfqmS-TvP02U8FtKSM2nr_7Dsd7qi2qEGnWV6IK7w
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import urllib.request
          from pathlib import Path
          from openpyxl import load_workbook

          sheet_id = os.environ["GOOGLE_SHEET_ID"]
          target = Path("/tmp/xsmb-source.xlsx")
          urls = [
              f"https://docs.google.com/spreadsheets/d/{sheet_id}/export?format=xlsx",
              f"https://docs.google.com/spreadsheets/u/0/d/{sheet_id}/export?format=xlsx",
          ]
          errors = []
          for url in urls:
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "MB-ALL-Website-Sync/1.0"})
                  with urllib.request.urlopen(req, timeout=90) as response:
                      body = response.read()
                  if not body.startswith(b"PK") or len(body) < 50000:
                      raise RuntimeError(f"invalid XLSX payload size={len(body)}")
                  target.write_bytes(body)
                  wb = load_workbook(target, read_only=True, data_only=True)
                  required = {"MB_History_27", "MAX2_Daily_Plan", "MAX2_Daily_Settlement", "MAX2_Backtest_2026_Monthly"}
                  missing = required.difference(wb.sheetnames)
                  wb.close()
                  if missing:
                      raise RuntimeError(f"missing sheets: {sorted(missing)}")
                  print("SOURCE_OK", target.stat().st_size)
                  break
              except Exception as exc:
                  errors.append(repr(exc))
          else:
              raise SystemExit(" | ".join(errors))
          PY

      - name: Synchronize current review and completed history
        run: |
          set -euo pipefail
          python scripts/sync_max2_website.py --source-xlsx /tmp/xsmb-source.xlsx

      - name: Validate public privacy and date lock
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import date, timedelta

          methods = json.load(open("ai-methods/public-methods.json", encoding="utf-8"))
          ready = json.load(open("data/paid-report-ready.json", encoding="utf-8"))
          source = json.load(open("data/source-access.json", encoding="utf-8"))
          status = json.load(open("data/max2-site-status.json", encoding="utf-8"))
          proof = json.load(open("data/public-historical-proof.json", encoding="utf-8"))

          target = date.fromisoformat(status["target_date"])
          lock = date.fromisoformat(status["data_lock"])
          assert lock == target - timedelta(days=1)
          assert methods["target_date"] == ready["report_date"] == status["target_date"]
          assert methods["data_lock"] == ready["data_lock"] == source["history_end"] == status["data_lock"]
          assert status["production_method"] == "MAX2_V1_R4268_P0072_HR60"
          assert status["paid_output_hidden"] is True
          assert proof["recent_period"]["period_end"] == status["data_lock"]
          forbidden = ("final_codes", "canonical_codes", "slot1_r4268", "slot2_selected")
          raw = json.dumps(status, ensure_ascii=False).lower()
          assert not any(token in raw for token in forbidden)
          print("MAX2_PUBLIC_SYNC_VALID", status["target_date"], status["data_lock"])
          PY

      - name: Commit synchronized public snapshot
        run: |
          set -euo pipefail
          files=(
            ai-methods/public-methods.json
            ai-methods/yesterday-proof.json
            data/source-access.json
            data/paid-report-ready.json
            data/public-historical-proof.json
            data/max2-site-status.json
          )
          if git diff --quiet -- "${files[@]}"; then
            echo "No new daily review to publish."
            exit 0
          fi
          git config user.name "mb-all-website-sync"
          git config user.email "actions@users.noreply.github.com"
          git add -- "${files[@]}"
          git commit -m "data: sync MB ALL Production review to website"
          git pull --rebase origin main
          git push origin HEAD:main
