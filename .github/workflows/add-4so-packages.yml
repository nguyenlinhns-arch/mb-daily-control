name: Add 4SO packages

on:
  push:
    paths:
      - '.github/workflows/add-4so-packages.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Repair package selector and pricing terms
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('ai-methods/index.html')
          s = p.read_text(encoding='utf-8')

          start = s.index('const initial=tomorrow();')
          end_marker = 'const track=(name,params={})=>{try{if(typeof window.fbq==="function")window.fbq("trackCustom",name,params)}catch{}};'
          end = s.index(end_marker, start) + len(end_marker)

          block = '''const initial=tomorrow();heroDate.value=dialogDate.value=initial;heroDate.min=heroDate.max=dialogDate.min=dialogDate.max=initial;
      const track=(name,params={})=>{try{if(typeof window.fbq==="function")window.fbq("trackCustom",name,params)}catch{}};
      const packages={day:{label:'Gói 1 ngày',price:30000,priceText:'30.000đ',memo:'1D'},week:{label:'Gói 1 tuần · 7 ngày',price:200000,priceText:'200.000đ',memo:'7D'},month:{label:'Gói 1 tháng · 30 ngày',price:800000,priceText:'800.000đ',memo:'30D'}};
      let selectedPackage='day';
      const packageButtons=[...document.querySelectorAll('[data-package]')];
      const selectedLabel=document.querySelector('#selected-package-label'),selectedPrice=document.querySelector('#selected-package-price'),payLabel=document.querySelector('#pay-package-label'),payPrice=document.querySelector('#pay-package-price');
      const syncDate=value=>{const safe=value===initial?value:initial;heroDate.value=dialogDate.value=safe;const f=format(safe);document.querySelectorAll("[data-date]").forEach(el=>el.textContent=f.display);document.querySelectorAll("[data-lock-date]").forEach(el=>el.textContent=previousDay(safe));memo.textContent=`4SO AI ${packages[selectedPackage].memo} ${f.display.replaceAll('/','-')}`};
      const updatePackage=(key,emit=true)=>{selectedPackage=packages[key]?key:'day';const pack=packages[selectedPackage];packageButtons.forEach(b=>b.classList.toggle('active',b.dataset.package===selectedPackage));if(selectedLabel)selectedLabel.textContent=pack.label;if(selectedPrice)selectedPrice.textContent=pack.priceText;if(payLabel)payLabel.textContent=pack.label;if(payPrice)payPrice.textContent=pack.priceText;syncDate(initial);if(emit)track('SelectPackage',{package:selectedPackage,price:pack.price})};
      packageButtons.forEach(b=>b.addEventListener('click',()=>updatePackage(b.dataset.package)));
      syncDate(initial);updatePackage('day',false);
      heroDate.addEventListener("input",()=>syncDate(heroDate.value));dialogDate.addEventListener("input",()=>syncDate(dialogDate.value));'''

          s = s[:start] + block + s[end:]

          # Remove one duplicated listener pair if the old block left it behind.
          dup = '\n      heroDate.addEventListener("input",()=>syncDate(heroDate.value));dialogDate.addEventListener("input",()=>syncDate(dialogDate.value));\n      '
          first = s.find(dup, start + len(block))
          if first != -1:
              s = s[:first] + '\n      ' + s[first + len(dup):]

          # Ensure copy-all is wired.
          copy_anchor = 'document.querySelector("#copy-memo").addEventListener("click",e=>copy(memo.textContent,e.currentTarget));'
          copy_listener = 'document.querySelector("#copy-all").addEventListener("click",e=>copy(`VPBank | 1128091987 | ${packages[selectedPackage].priceText} | ${memo.textContent}`,e.currentTarget));'
          if copy_listener not in s:
              s = s.replace(copy_anchor, copy_anchor + copy_listener)

          # Package-aware mobile and closing CTA.
          s = s.replace('<div class="mobile-bar"><div><span>Bản tin <span data-date>--/--/----</span></span><strong>30.000đ / ngày</strong></div><button type="button" data-open>Đăng ký 30K</button></div>', '<div class="mobile-bar"><div><span>Bản tin từ <span data-date>--/--/----</span></span><strong>Gói từ 30.000đ</strong></div><button type="button" data-open>Chọn gói</button></div>')
          s = s.replace('<h2>30.000đ cho một bản tin<br>đã có dữ liệu, kiểm định và xếp hạng</h2>', '<h2>Chọn gói 1 ngày, 1 tuần<br>hoặc 1 tháng</h2>')
          s = s.replace('<p>Không cần tạo tài khoản. Bấm đăng ký để xem thông tin chuyển khoản và hướng dẫn nhận bản tin.</p>', '<p>Từ 30.000đ. Thanh toán một lần, không tự gia hạn. Gói dài ngày áp dụng cho các bản tin liên tiếp từ ngày bắt đầu.</p>')
          s = s.replace('<button type="button" data-open>ĐĂNG KÝ NHẬN BẢN TIN →</button>', '<button type="button" data-open>CHỌN GÓI & ĐĂNG KÝ →</button>')

          # SEO structured offers.
          s = re.sub(r'<script type="application/ld\+json">\{"@context":"https://schema.org","@type":"Service","name":"4SO AI".*?</script>', '<script type="application/ld+json">{"@context":"https://schema.org","@type":"Service","name":"4SO AI","description":"Bản tin phân tích dữ liệu Xổ số Miền Bắc theo ngày.","areaServed":"VN","offers":[{"@type":"Offer","name":"Gói 1 ngày","price":"30000","priceCurrency":"VND"},{"@type":"Offer","name":"Gói 1 tuần - 7 ngày","price":"200000","priceCurrency":"VND"},{"@type":"Offer","name":"Gói 1 tháng - 30 ngày","price":"800000","priceCurrency":"VND"}]}</script>', s, count=1, flags=re.S)

          p.write_text(s, encoding='utf-8')

          lp = Path('ai-methods/legal.html')
          l = lp.read_text(encoding='utf-8')
          l = re.sub(r'<h3>1\. Phí truy cập</h3><p>.*?</p>', '<h3>1. Phí truy cập</h3><p>Các gói đang áp dụng: <strong>30.000đ / 1 ngày</strong>, <strong>200.000đ / 7 ngày liên tiếp</strong> và <strong>800.000đ / 30 ngày liên tiếp</strong>. Gói tuần và gói tháng bắt đầu từ ngày bản tin hiển thị khi đăng ký. Đây là phí dịch vụ dữ liệu, thanh toán một lần và <strong>không tự gia hạn</strong>; không phải tiền đặt cược.</p>', l, count=1, flags=re.S)
          lp.write_text(l, encoding='utf-8')
          PY
      - name: Verify
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('ai-methods/index.html').read_text(encoding='utf-8')
          assert s.index('const track=') < s.index('const packages=') < s.index('const updatePackage=')
          assert "memo.textContent=`4SO AI ${packages[selectedPackage].memo}" in s
          assert s.count('id="copy-all"') == 1
          assert '200.000đ' in s and '800.000đ' in s
          l=Path('ai-methods/legal.html').read_text(encoding='utf-8')
          assert '200.000đ / 7 ngày' in l and '800.000đ / 30 ngày' in l
          print('OK')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai-methods/index.html ai-methods/legal.html
          git commit -m 'Repair package selector and package terms'
          git push origin HEAD:main
