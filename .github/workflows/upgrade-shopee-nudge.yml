name: Upgrade Shopee nudge creative

on:
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/upgrade-shopee-nudge.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Bust affiliate creative caches
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/apply_conversion_v2.py')
          t=p.read_text(encoding='utf-8')
          t=t.replace('checkout-enhance.js?v=20260815-4','checkout-enhance.js?v=20260816-1')
          t=t.replace('finance-banner.js?v=20260816-1','finance-banner.js?v=20260816-2')
          p.write_text(t,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/apply_conversion_v2.py
          git commit -m 'Bust affiliate creative caches'
          git push origin HEAD:main
