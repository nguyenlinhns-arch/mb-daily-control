name: V32 Stable compute 2026-08-12

on:
  push:
    paths:
      - '.github/workflows/v32-stable-compute-20260812.yml'

permissions:
  contents: read

jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
      TZ: Asia/Ho_Chi_Minh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-v32.txt
      - name: Install runtime
        run: python -m pip install --requirement requirements-v32.txt
      - name: Fetch frozen engine
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "$GOOGLE_SERVICE_ACCOUNT_JSON"
          python scripts/fetch_v32_engine.py --metadata data/v32-engine-runtime.json --destination engine_v32
          python scripts/v32_daily.py verify-seed
      - name: Snapshot source through 2026-08-11
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v32stable"
          python scripts/google_sheets_bridge.py snapshot --settlement-date 2026-08-11 --output-xlsx "$RUNNER_TEMP/v32stable/source.xlsx" --output-pnl-json "$RUNNER_TEMP/v32stable/pnl-snapshot.json"
      - name: Run exact frozen V32 for 2026-08-12
        env:
          MB_V32_SOURCE_XLSX: ${{ runner.temp }}/v32stable/source.xlsx
          MB_V32_CODE_CACHE: ${{ runner.temp }}/v32stable/v9_code_predictions.pkl
          MB_V32_SEED_CACHE: ${{ runner.temp }}/v32stable/v9_code_seed_predictions.pkl
        run: |
          set -euo pipefail
          python engine_v32/runtime_plan.py --source-end 2026-08-11 | tee "$RUNNER_TEMP/v32stable/v32-plan.log"
          grep '^V32_PLAN_JSON=' "$RUNNER_TEMP/v32stable/v32-plan.log" > "$RUNNER_TEMP/v32stable/v32-plan-final.txt"
          test "$(wc -l < "$RUNNER_TEMP/v32stable/v32-plan-final.txt")" -eq 1
      - name: Upload result only
        uses: actions/upload-artifact@v4
        with:
          name: v32-stable-20260812-result
          path: |
            ${{ runner.temp }}/v32stable/v32-plan-final.txt
            ${{ runner.temp }}/v32stable/v32-plan.log
          retention-days: 3
