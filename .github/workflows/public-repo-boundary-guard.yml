name: Guard public repository boundary

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with previous commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate public/private boundary and frontend syntax
        run: |
          set -euo pipefail
          python scripts/public_repo_boundary_guard.py --self-test
          python scripts/public_repo_boundary_guard.py
          python scripts/bundle_portal_css.py --self-test
          python scripts/fingerprint_portal_assets.py --self-test
          python scripts/enrich_portal_metadata.py --self-test
          node --check site-v2/portal-v2.js
          node --check site-v2/checkout-entry.js
          grep -q 'xsmb_lookup_compare' site-v2/portal-v2.js
          grep -q 'web_vitals_summary' site-v2/portal-v2.js
          grep -q 'lm_analytics_consent_v1' site-v2/portal-v2.js
          grep -q 'portal-number-compare' site-v2/portal-v3.css
          grep -q 'portal-consent' site-v2/portal-v3.css
          ! grep -q 'statistics-data.json' site-v2/checkout-entry.js
