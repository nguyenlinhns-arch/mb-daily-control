name: Enforce ACCESSTRADE-only monetization

on:
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/accesstrade-only-monetization.yml'
      - 'scripts/enforce_accesstrade_only.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove all non-ACCESSTRADE ads
        run: python scripts/enforce_accesstrade_only.py
      - name: Verify portal asset self-test
        run: python scripts/apply_portal_v3_assets.py --self-test
      - name: Verify ACCESSTRADE links remain
        run: |
          grep -q 'go.isclix.com/deep_link' site-v2/checkout-enhance.js
          grep -q 'go.isclix.com/deep_link' site-v2/finance-banner.js
      - name: Commit cleanup
        run: |
          if git diff --quiet -- scripts/apply_portal_v3_assets.py ai-methods/index.html .github/workflows/clarify-xsmb-statistics.yml; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/apply_portal_v3_assets.py ai-methods/index.html .github/workflows/clarify-xsmb-statistics.yml
          git commit -m 'Keep ACCESSTRADE-only monetization'
          git push origin HEAD:main
