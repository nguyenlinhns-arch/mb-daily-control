name: Publish website after private 00:05 pipeline

on:
  schedule:
    # GitHub cron uses UTC. 17:05 UTC = 00:05 Asia/Ho_Chi_Minh.
    - cron: "5 17 * * *"
  workflow_dispatch:
    inputs:
      lock_date:
        description: "Ngày dữ liệu đã khóa YYYY-MM-DD; để trống dùng ngày hôm qua tại Việt Nam"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: daily-report-midnight
  cancel-in-progress: true

jobs:
  publish-correct-calendar-day:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
      TZ: Asia/Ho_Chi_Minh
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install locked parser dependency
        run: python -m pip install --disable-pip-version-check openpyxl==3.1.5

      - name: Resolve T-1 and T in Vietnam
        env:
          MANUAL_DATE: ${{ github.event.inputs.lock_date || '' }}
        run: |
          set -euo pipefail
          if [[ -n "${MANUAL_DATE:-}" ]]; then
            [[ "$MANUAL_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || exit 2
            target="$MANUAL_DATE"
          else
            target="$(date -d 'yesterday' +%F)"
          fi
          report="$(date -d "$target +1 day" +%F)"
          echo "LOCK_DATE=$target" >> "$GITHUB_ENV"
          echo "REPORT_DATE=$report" >> "$GITHUB_ENV"

      - name: Wait for private readiness before any public mutation
        run: |
          set -euo pipefail
          for attempt in {1..6}; do
            if python - <<'PY'
          import json
          import os
          from pathlib import Path

          lock = os.environ["LOCK_DATE"]
          report = os.environ["REPORT_DATE"]

          def load(path):
              return json.loads(Path(path).read_text(encoding="utf-8"))

          methods = load("ai-methods/public-methods.json")
          ready = load("data/paid-report-ready.json")
          proof = load("ai-methods/yesterday-proof.json")
          historical = load("data/public-historical-proof.json")

          errors = []
          if methods.get("target_date") != report or methods.get("data_lock") != lock:
              errors.append(f"public-methods={methods.get('target_date')}/{methods.get('data_lock')}")
          if ready.get("report_date") != report or ready.get("data_lock") != lock or ready.get("status") != "PUBLISHED_PASS_PRIVATE":
              errors.append(f"paid-ready={ready.get('report_date')}/{ready.get('data_lock')}/{ready.get('status')}")
          if proof.get("date") != lock:
              errors.append(f"yesterday-proof={proof.get('date')}")
          validation = historical.get("validation") or {}
          recent = historical.get("recent_period") or {}
          if validation.get("window_end") != lock:
              errors.append(f"historical-proof-window={validation.get('window_end')}")
          if recent.get("period_end") != lock:
              errors.append(f"historical-proof-recent={recent.get('period_end')}")
          if errors:
              raise SystemExit("FAIL_CLOSED_PRIVATE_NOT_READY: " + "; ".join(errors))
          print(f"PRIVATE_READINESS_OK report={report} lock={lock}")
          PY
            then
              exit 0
            fi
            if [[ "$attempt" -eq 6 ]]; then
              echo "Private readiness is still stale after 30 minutes. No public history/report files were mutated."
              exit 1
            fi
            echo "Private readiness chưa đủ; thử lại sau 5 phút ($attempt/6)."
            sleep 300
          done

      - name: Normalize and validate history container
        run: |
          set -euo pipefail
          python scripts/normalize_history_pack.py --self-test
          python scripts/normalize_history_pack.py

      - name: Cross-check and lock the latest completed draw
        run: |
          set -euo pipefail
          for attempt in {1..6}; do
            if python scripts/update_completed_draw_report.py --draw-date "$LOCK_DATE"; then
              exit 0
            fi
            if [[ "$attempt" -eq 6 ]]; then
              echo "Không đủ nguồn đối chiếu; giữ nguyên báo cáo cũ và không gắn nhầm ngày."
              exit 1
            fi
            echo "Nguồn chưa sẵn sàng; thử lại sau 5 phút ($attempt/6)."
            sleep 300
          done

      - name: Validate completed-history integrity and public boundary
        run: |
          set -euo pipefail
          python -m py_compile scripts/update_completed_draw_report.py scripts/build_public_snapshot.py scripts/normalize_history_pack.py scripts/mb4so_daily.py
          python scripts/normalize_history_pack.py --self-test
          python scripts/mb4so_daily.py self-test
          python -m unittest tests/test_mb4so_daily.py -v
          node --check site-v2/app.js
          node -e "new Function(require('fs').readFileSync('site-v2/approval-backend.gs','utf8'))"
          node tests/commerce-policy-smoke.mjs
          ! grep -niE 'hôm nay đánh|chốt số|số đẹp|bao lô|xiên|cam kết trúng|mở kết luận|15\.000' \
            site-v2/index.html site-v2/mau-bao-cao.html
          git diff --check

      - name: Explain fail-closed separation
        run: |
          echo "Completed historical results may be committed once independently cross-checked."
          echo "The Pages workflow still runs the full paid-readiness/public-proof gate and refuses production deploy if the private report is stale."

      - name: Commit the correctly dated report
        run: |
          set -euo pipefail
          git config user.name "mb-daily-report-automation"
          git config user.email "actions@users.noreply.github.com"
          git add data/history-27.bz2.b64 data/source-access.json \
            data/completed-draw-audit.json site-v2/index.html site-v2/mau-bao-cao.html
          if git diff --cached --quiet; then
            echo "The correctly dated report is already published."
            exit 0
          fi
          git commit -m "auto: publish 00:05 report using locked data $LOCK_DATE"
          git pull --rebase origin main
          git push origin HEAD:main
