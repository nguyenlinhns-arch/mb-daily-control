name: Deploy daily AI data report site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    # Fail closed just after the Vietnam date changes, then retry after the 00:05 operation.
    - cron: "1 17 * * *"
    - cron: "15 18 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  test-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test site
        run: |
          npm test
          python scripts/simplify_public_site.py --self-test
          python scripts/replace_public_analysis_wording.py --self-test
          python scripts/optimize_conversion_site.py --self-test

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build static artifact
        run: |
          set -euo pipefail
          python scripts/build_public_methods.py --self-test
          python scripts/build_seo_pages.py --self-test
          rm -rf _site
          mkdir -p _site/ai-methods
          cp site-v2/styles.css _site/
          cp site-v2/red-white-theme.css _site/
          cp site-v2/conversion-accent.css _site/
          cp site-v2/checkout-hotfix.css _site/
          cp site-v2/checkout-entry.js _site/
          cp site-v2/app.js _site/
          cp site-v2/config.js _site/
          cp site-v2/mau-bao-cao.html _site/
          cp site-v2/legal.html _site/
          cp site-v2/404.html _site/
          cp site-v2/robots.txt _site/
          cp site-v2/favicon.svg _site/
          cp site-v2/og.png _site/
          cp ai-methods/seo.css _site/ai-methods/
          cp ai-methods/og-4so-ai-v2.jpg _site/ai-methods/
          cp data/source-access.json _site/
          cp data/public-historical-proof.json _site/historical-proof.json
          cp data/paid-report-ready.json _site/report-readiness.json
          python scripts/build_seo_pages.py --output-root _site

          # The simplifier reads the legacy hero template. Normalize only the
          # temporary build artifact so it can parse the button; the final paid
          # gate is reapplied from the private-safe readiness manifest below.
          python - <<'PY'
          from pathlib import Path
          import re

          page = Path("_site/index.html")
          content = page.read_text(encoding="utf-8")
          content = re.sub(
              r'(<button class="button button-primary button-large" type="button" data-open-checkout)\s+disabled(?:\s+aria-disabled="true")?(>)',
              r'\1\2',
              content,
              count=1,
          )
          page.write_text(content, encoding="utf-8")
          PY

          python scripts/simplify_public_site.py --output-root _site
          find _site -type f -name '*.html' -print0 | xargs -0 sed -i 's/Ngày hiển thị/Ngày hôm nay/g; s/ngày hiển thị/ngày hôm nay/g'
          python scripts/replace_public_analysis_wording.py --output-root _site
          python scripts/apply_conversion_site.py --output-root _site
          python scripts/simplify_purchase_cta.py --output-root _site
          find _site -type f -name '*.html' -print0 | xargs -0 sed -i -E 's#app\.js\?v=[^"]+#app.js?v=20260815-1#g'

          test -s _site/red-white-theme.css
          test -s _site/conversion-accent.css
          test -s _site/checkout-hotfix.css
          test -s _site/checkout-entry.js
          test -s _site/report-readiness.json
          test ! -e _site/ai-methods/public-methods.json
          test -s _site/ai-methods/yesterday-proof.json
          test -s _site/cho-so-mien-bac-hom-nay/index.html
          test -s _site/phuong-phap-4so/index.html
          test -s _site/lich-su-doi-chieu/index.html
          test -s _site/thong-ke-lo-to-mien-bac-bang-ai/index.html
          test -s _site/gioi-thieu/index.html
          test -s _site/sitemap.xml
          test -s _site/llms.txt

          grep -q 'data-public-ready="true"' _site/index.html
          grep -q 'data-paid-report-ready="true"' _site/index.html
          grep -q 'checkout-entry.js?v=20260815-1' _site/index.html
          grep -q 'class="conversion-trust"' _site/index.html
          grep -q 'class="conversion-preview"' _site/index.html
          grep -q 'NHẬN BÁO CÁO HÔM NAY – 30.000Đ' _site/index.html
          ! grep -q 'MỞ KẾT LUẬN' _site/index.html
          grep -q 'class="buy-value-list"' _site/index.html
          grep -q 'class="buy-guarantees"' _site/index.html
          grep -q 'class="checkout-value"' _site/index.html
          grep -q 'class="checkout-trust"' _site/index.html
          grep -q 'href="/?checkout=1"' _site/cho-so-mien-bac-hom-nay/index.html
          grep -q 'class="seo-purchase-float"' _site/cho-so-mien-bac-hom-nay/index.html
          ! grep -R 'href="/#buy"' _site --include='*.html'
          ! grep -R 'href="/#pricing"' _site --include='*.html'
          if grep -q 'class="historical-disclaimer"' _site/index.html; then
            grep -q 'class="history-disclosure"' _site/index.html
            grep -q 'class="history-cta"' _site/index.html
            grep -q 'có số được phân tích đúng' _site/index.html
          fi
          grep -q 'app.js?v=20260815-1' _site/index.html
          ! grep -R "một trong bốn đầu ra" _site --include='*.html'
          ! grep -R "có ít nhất một đầu ra xuất hiện" _site --include='*.html'
          ! grep -R "SỐ CÔNG KHAI HÔM NAY" _site --include='*.html'
          ! grep -R "public-methods-v2" _site/index.html
          ! grep -R "data-current-methods" _site/cho-so-mien-bac-hom-nay/index.html
          ! grep -R -i "ngày hiển thị" _site --include='*.html'
          touch _site/.nojekyll
          test ! -e _site/approval-backend.gs
          test ! -e _site/ai-methods/report-data.json

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
