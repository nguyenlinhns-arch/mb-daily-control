name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    # 01:15 Vietnam time: rebuild dated HTML even if daily data has not changed.
    - cron: "15 18 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build static artifact
        run: |
          set -euo pipefail
          python scripts/build_public_methods.py --self-test
          npm test
          rm -rf _site
          mkdir -p _site/control
          cp index.html styles.css app.js _site/control/
          cp 404.html favicon.svg robots.txt sitemap.xml _site/
          cp -R ai-methods _site/
          cp ai-methods/legal-v3.html _site/legal.html
          cp ai-methods/legal-v3.html _site/ai-methods/legal.html

          python - <<'PY'
          from pathlib import Path

          html = Path('ai-methods/landing-v7.html').read_text(encoding='utf-8')
          html = html.replace('<details open>', '<details>')
          data = html.encode('utf-8')
          for target in [
              Path('_site/index.html'),
              Path('_site/ai-methods/index.html'),
              Path('_site/ai-methods/landing-v7.html'),
          ]:
              target.write_bytes(data)
          PY

          python scripts/build_seo_pages.py --output-root _site

          grep -n 'class="context-phrase">BẢNG PHÂN TÍCH</span>' _site/index.html | head
          grep -n 'class="context-phrase">AI 4SO</span>' _site/index.html | head
          grep -n '80%' _site/index.html | head
          grep -n 'KẾT LUẬN CUỐI CÙNG' _site/index.html | head
          grep -n 'MỞ KẾT LUẬN' _site/index.html | head
          test -s _site/ai-methods/public-methods.json
          grep -n 'MB_PUBLIC_METHOD_OUTPUTS_V2_TODAY_ONLY' _site/ai-methods/public-methods.json | head
          grep -n 'v7-overrides.css' _site/index.html | head
          grep -n 'Cho số Miền Bắc hôm nay' _site/cho-so-mien-bac-hom-nay/index.html | head
          grep -n 'cssSelector":".paywall"' _site/cho-so-mien-bac-hom-nay/index.html | head
          grep -n 'Phương pháp 4SO' _site/phuong-phap-4so/index.html | head
          grep -n 'Lịch sử đối chiếu' _site/lich-su-doi-chieu/index.html | head
          grep -n 'Thống kê Lô tô Miền Bắc' _site/thong-ke-lo-to-mien-bac-bang-ai/index.html | head
          grep -n 'https://lemienbac.com/cho-so-mien-bac-hom-nay/' _site/sitemap.xml | head
          touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
