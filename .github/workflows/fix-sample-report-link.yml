name: Fix sample report link
on:
  push:
    paths: ['.github/workflows/fix-sample-report-link.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fix link
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('ai-methods/landing-v3.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('href="sample-report.html"','href="/ai-methods/sample-report.html"')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify and commit
        run: |
          grep -n '/ai-methods/sample-report.html' ai-methods/landing-v3.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai-methods/landing-v3.html
          git commit -m 'Fix public sample report link' || exit 0
          git push origin HEAD:main
# retrigger
