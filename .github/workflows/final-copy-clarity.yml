name: Final conversion copy clarity
on:
  push:
    paths: ['.github/workflows/final-copy-clarity.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Clarify conversion copy
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('ai-methods/landing-v3.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<b>24/30 ngày</b><span>có ít nhất một đầu ra xuất hiện</span>', '<b>24/30 ngày</b><span>có ít nhất 1 trong 4 số xuất hiện</span>')
          s=s.replace('<h2>Đưa dữ liệu vào quyết định</h2>', '<h2>Thay cảm tính bằng dữ liệu</h2>')
          s=s.replace('Thay vì chỉ dựa vào “cầu”, số nóng/lạnh hoặc cảm tính, 4SO AI phân tích kết quả Xổ số Miền Bắc từ <strong>năm 2020 đến nay</strong> theo quy trình đã khóa trước kỳ.', 'Thay vì chọn theo “cầu”, số nóng/lạnh rồi chờ may mắn, 4SO AI phân tích kết quả Xổ số Miền Bắc từ <strong>năm 2020 đến nay</strong> bằng quy trình thống kê đã khóa trước kỳ.')
          s=s.replace('<span>80% lịch sử · Báo cáo XSMB</span>', '<span>80% kiểm định lịch sử · XSMB</span>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify and commit
        run: |
          grep -n '1 trong 4 số' ai-methods/landing-v3.html
          grep -n 'Thay cảm tính bằng dữ liệu' ai-methods/landing-v3.html
          grep -n '80% kiểm định lịch sử' ai-methods/landing-v3.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai-methods/landing-v3.html
          git commit -m 'Clarify 4SO conversion copy' || exit 0
          git push origin HEAD:main
