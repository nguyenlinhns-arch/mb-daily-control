name: Guard public repository boundary

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with previous commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate public/private boundary and frontend syntax
        run: |
          set -euo pipefail
          python scripts/public_repo_boundary_guard.py --self-test
          python scripts/public_repo_boundary_guard.py
          python scripts/bundle_portal_css.py --self-test
          python scripts/fingerprint_portal_assets.py --self-test
          python scripts/share_statistics_loader.py --self-test
          python scripts/enrich_portal_metadata.py --self-test
          python scripts/optimize_monetization_placement.py --self-test
          python scripts/optimize_seo_ads_v1.py --self-test
          python scripts/finalize_portal_v4.py --self-test
          python scripts/indexnow_submit.py --self-test
          node --check site-v2/portal-v2.js
          node --check site-v2/ads-tracking.js
          node --check site-v2/finance-banner.js
          node --check site-v2/checkout-entry.js
          grep -q 'xsmb_lookup_compare' site-v2/portal-v2.js
          grep -q 'web_vitals_summary' site-v2/portal-v2.js
          grep -q 'lm_analytics_consent_v1' site-v2/portal-v2.js
          grep -q 'xsmb_history_date_open' site-v2/portal-v2.js
          grep -q "'/xsmb-30-ngay/'" site-v2/portal-v2.js
          grep -q "'/nguon-du-lieu-xsmb/'" site-v2/portal-v2.js
          grep -q 'const dataRoutes=' site-v2/portal-v2.js
          grep -q 'data-google-ads-landing' scripts/optimize_seo_ads_v1.py
          grep -q 'MONETIZATION_TOKENS' scripts/optimize_seo_ads_v1.py
          grep -q 'data-lm-native-ad-src' scripts/optimize_monetization_placement.py
          grep -q 'data-seo-discovery-links' scripts/optimize_monetization_placement.py
          grep -q 'affiliate_evergreen' scripts/optimize_monetization_placement.py
          grep -q 'IntersectionObserver' site-v2/ads-tracking.js
          grep -q 'affiliate_click' site-v2/ads-tracking.js
          grep -q 'ad_slot_view' site-v2/ads-tracking.js
          grep -q 'ad_slot_load' site-v2/ads-tracking.js
          grep -q 'home_upper_after_header' site-v2/finance-banner.js
          grep -q 'affiliate_finance_view' site-v2/finance-banner.js
          grep -q 'Từ 1,2%/tháng · Đăng ký ban đầu chỉ cần Căn cước công dân' site-v2/finance-banner.js
          grep -q 'Đăng ký vay online' site-v2/finance-banner.js
          grep -q 'portal-topline' site-v2/finance-banner.js
          ! grep -q '59%/năm' site-v2/finance-banner.js
          grep -q 'portal-number-compare' site-v2/portal-v3.css
          grep -q 'portal-history-codes' site-v2/portal-v3.css
          ! grep -q 'portal-consent' site-v2/portal-v3.css
          ! grep -q 'statistics-data.json' site-v2/checkout-entry.js
