name: Live SEO and indexability health

on:
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/live-seo-health.yml'
  schedule:
    # 00:30 UTC = 07:30 Asia/Ho_Chi_Minh
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-seo-health
  cancel-in-progress: true

jobs:
  audit-live-site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: https://lemienbac.com
    steps:
      - name: Check robots, sitemap and core landing pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/lm-live
          curl -fsSL --retry 3 --retry-delay 2 "$BASE_URL/robots.txt" -o /tmp/lm-live/robots.txt
          curl -fsSL --retry 3 --retry-delay 2 "$BASE_URL/sitemap.xml" -o /tmp/lm-live/sitemap.xml
          grep -q '^User-agent: \*$' /tmp/lm-live/robots.txt
          grep -q '^Allow: /$' /tmp/lm-live/robots.txt
          grep -q 'Sitemap: https://lemienbac.com/sitemap.xml' /tmp/lm-live/robots.txt
          grep -q '<loc>https://lemienbac.com/</loc>' /tmp/lm-live/sitemap.xml
          grep -q '<loc>https://lemienbac.com/thong-ke-xsmb/</loc>' /tmp/lm-live/sitemap.xml
          grep -q '<loc>https://lemienbac.com/tan-suat-xsmb/</loc>' /tmp/lm-live/sitemap.xml
          grep -q '<loc>https://lemienbac.com/lo-gan-xsmb/</loc>' /tmp/lm-live/sitemap.xml
          grep -q '<loc>https://lemienbac.com/cap-dao-xsmb/</loc>' /tmp/lm-live/sitemap.xml
          grep -q '<loc>https://lemienbac.com/tra-cuu-xsmb/</loc>' /tmp/lm-live/sitemap.xml

      - name: Crawl sitemap with Googlebot mobile user agent
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          import time
          import urllib.request
          import xml.etree.ElementTree as ET
          from pathlib import Path

          base = "https://lemienbac.com"
          ua = "Mozilla/5.0 (Linux; Android 10; K) AppleWebKit/537.36 Chrome/131.0 Mobile Safari/537.36 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)"
          xml = Path('/tmp/lm-live/sitemap.xml').read_text(encoding='utf-8')
          root = ET.fromstring(xml)
          ns = {'sm': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
          urls = [node.text.strip() for node in root.findall('sm:url/sm:loc', ns) if node.text]
          if not 15 <= len(urls) <= 40:
              raise SystemExit(f"Unexpected sitemap URL count: {len(urls)}")
          if len(urls) != len(set(urls)):
              raise SystemExit('Duplicate URLs found in sitemap')
          forbidden_routes = ('thong-ke-giai-dac-biet', 'thong-ke-de-', '/de-xsmb')
          if any(any(token in u.lower() for token in forbidden_routes) for u in urls):
              raise SystemExit('Removed special-prize/Đề route leaked back into sitemap')

          rows = []
          failures = []
          for url in urls:
              req = urllib.request.Request(url, headers={'User-Agent': ua, 'Accept': 'text/html,application/xhtml+xml'})
              started = time.monotonic()
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      body = r.read()
                      code = r.status
                      content_type = r.headers.get('content-type', '')
              except Exception as exc:
                  failures.append(f"{url}: {exc}")
                  continue
              elapsed = time.monotonic() - started
              text = body.decode('utf-8', errors='replace')
              size_kb = len(body) / 1024
              if code != 200:
                  failures.append(f"{url}: HTTP {code}")
              if url.endswith('/') or url.endswith('.html'):
                  if 'text/html' not in content_type:
                      failures.append(f"{url}: unexpected content-type {content_type}")
                  if re.search(r'<meta[^>]+name=[\"\']robots[\"\'][^>]+content=[\"\'][^\"\']*noindex', text, re.I):
                      failures.append(f"{url}: noindex detected")
                  canonical = re.search(r'<link[^>]+rel=[\"\']canonical[\"\'][^>]+href=[\"\']([^\"\']+)', text, re.I)
                  if not canonical or not canonical.group(1).startswith(base):
                      failures.append(f"{url}: canonical missing or off-domain")
                  if '<title>' not in text.lower() or 'name="description"' not in text.lower():
                      failures.append(f"{url}: title/description missing")
              rows.append((url, elapsed, size_kb))

          landing_url = base + '/thong-ke-xsmb/'
          req = urllib.request.Request(landing_url, headers={'User-Agent': ua})
          with urllib.request.urlopen(req, timeout=20) as r:
              landing = r.read().decode('utf-8', errors='replace').lower()
          for token in ('data-open-checkout', 'effectivecpmnetwork.com', 'highperformanceformat.com', '/?checkout=1'):
              if token in landing:
                  failures.append(f"Google Ads statistics landing contains monetization token: {token}")

          status_req = urllib.request.Request(base + '/site-status.json', headers={'User-Agent': ua})
          with urllib.request.urlopen(status_req, timeout=20) as r:
              import json
              status = json.loads(r.read().decode('utf-8'))
          if status.get('status') != 'HEALTHY':
              failures.append(f"site-status is {status.get('status')!r}, expected HEALTHY")

          summary = Path('/tmp/lm-live/summary.md')
          with summary.open('w', encoding='utf-8') as f:
              f.write('## Live SEO health\n\n')
              f.write(f'- Sitemap URLs: **{len(urls)}**\n')
              f.write(f'- Crawled successfully: **{len(rows)}/{len(urls)}**\n')
              if rows:
                  avg = sum(x[1] for x in rows) / len(rows)
                  slow = max(rows, key=lambda x: x[1])
                  heavy = max(rows, key=lambda x: x[2])
                  f.write(f'- Average fetch time: **{avg:.2f}s**\n')
                  f.write(f'- Slowest: `{slow[0]}` — **{slow[1]:.2f}s**\n')
                  f.write(f'- Largest HTML: `{heavy[0]}` — **{heavy[2]:.0f} KB**\n')
              if failures:
                  f.write('\n### Failures\n')
                  for item in failures:
                      f.write(f'- {item}\n')
              else:
                  f.write('\n**PASS — live site is crawlable and core SEO gates are healthy.**\n')

          if failures:
              raise SystemExit('\n'.join(failures))
          PY
          cat /tmp/lm-live/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce mobile first-party performance budgets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          import time
          import urllib.parse
          import urllib.request
          from pathlib import Path

          BASE = 'https://lemienbac.com'
          UA = 'Mozilla/5.0 (Linux; Android 14; Pixel 7) AppleWebKit/537.36 Chrome/131.0 Mobile Safari/537.36'
          # These are regression ceilings, not claims about field Core Web Vitals.
          BUDGETS = {
              '/': {'html_kb': 120, 'first_party_css_js_kb': 350},
              '/thong-ke-xsmb/': {'html_kb': 100, 'first_party_css_js_kb': 200},
          }
          DATA_MAX_KB = 250

          def fetch(url):
              req = urllib.request.Request(url, headers={'User-Agent': UA, 'Accept-Encoding': 'identity'})
              started = time.monotonic()
              with urllib.request.urlopen(req, timeout=20) as response:
                  body = response.read()
                  if response.status != 200:
                      raise RuntimeError(f'{url}: HTTP {response.status}')
              return body, time.monotonic() - started

          failures = []
          report = []
          for path, budget in BUDGETS.items():
              page_url = BASE + path
              body, elapsed = fetch(page_url)
              text = body.decode('utf-8', errors='replace')
              html_kb = len(body) / 1024
              assets = []
              for raw in re.findall(r'<(?:script[^>]+src|link[^>]+href)=["\']([^"\']+)', text, re.I):
                  absolute = urllib.parse.urljoin(page_url, raw)
                  parsed = urllib.parse.urlparse(absolute)
                  if parsed.netloc != 'lemienbac.com':
                      continue
                  if not parsed.path.lower().endswith(('.css', '.js')):
                      continue
                  if absolute not in assets:
                      assets.append(absolute)
              asset_bytes = 0
              asset_rows = []
              for asset in assets:
                  content, asset_elapsed = fetch(asset)
                  asset_bytes += len(content)
                  asset_rows.append((asset, len(content) / 1024, asset_elapsed))
              asset_kb = asset_bytes / 1024
              report.append((path, html_kb, asset_kb, elapsed, asset_rows))
              if html_kb > budget['html_kb']:
                  failures.append(f'{path}: HTML {html_kb:.0f} KB > {budget["html_kb"]} KB budget')
              if asset_kb > budget['first_party_css_js_kb']:
                  failures.append(f'{path}: first-party CSS+JS {asset_kb:.0f} KB > {budget["first_party_css_js_kb"]} KB budget')

          stats, stats_elapsed = fetch(BASE + '/statistics-data.json')
          stats_kb = len(stats) / 1024
          if stats_kb > DATA_MAX_KB:
              failures.append(f'/statistics-data.json: {stats_kb:.0f} KB > {DATA_MAX_KB} KB budget')

          out = Path('/tmp/lm-live/performance.md')
          with out.open('w', encoding='utf-8') as f:
              f.write('\n## Mobile performance regression budget\n\n')
              for path, html_kb, asset_kb, elapsed, asset_rows in report:
                  f.write(f'- `{path}` HTML: **{html_kb:.0f} KB**; first-party CSS+JS: **{asset_kb:.0f} KB**; HTML fetch: **{elapsed:.2f}s**\n')
                  if asset_rows:
                      heavy = max(asset_rows, key=lambda row: row[1])
                      f.write(f'  - Largest first-party asset: `{urllib.parse.urlparse(heavy[0]).path}` — **{heavy[1]:.0f} KB**\n')
              f.write(f'- `/statistics-data.json`: **{stats_kb:.0f} KB**; fetch: **{stats_elapsed:.2f}s**\n')
              if failures:
                  f.write('\n### Performance budget failures\n')
                  for item in failures:
                      f.write(f'- {item}\n')
              else:
                  f.write('\n**PASS — no material first-party mobile weight regression.**\n')
          print(out.read_text(encoding='utf-8'))
          if failures:
              raise SystemExit('\n'.join(failures))
          PY
          cat /tmp/lm-live/performance.md >> "$GITHUB_STEP_SUMMARY"

      - name: Check HTTPS and www canonical behavior
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSI --retry 3 "$BASE_URL/" | grep -Eiq '^content-type:.*text/html'
          final="$(curl -sSIL -o /dev/null -w '%{url_effective}' --max-redirs 5 https://www.lemienbac.com/ || true)"
          if [[ -n "$final" && "$final" != "https://lemienbac.com/" && "$final" != "https://www.lemienbac.com/" ]]; then
            echo "Unexpected www final URL: $final" >&2
            exit 1
          fi
