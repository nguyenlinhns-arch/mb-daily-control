name: Probe ACCESSTRADE landing

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/probe-accesslanding.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch public landing and extract tracking links
        shell: bash
        run: |
          set -euo pipefail
          URL="https://nguyenlinhtkv_aul4jx.accesslanding.site/"
          curl -L --fail --silent --show-error --compressed \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36" \
            "$URL" -o landing.html
          echo "=== SIZE ==="
          wc -c landing.html
          echo "=== DEEP LINK URLS ==="
          python - <<'PY'
          import html, re
          text=open('landing.html',encoding='utf-8',errors='ignore').read()
          decoded=html.unescape(text).replace('\\/','/')
          pats=[
              r'https?://[^\"\'<>\s]*go\.isclix\.com[^\"\'<>\s]*',
              r'https?://[^\"\'<>\s]*fast\.accesstrade\.com\.vn[^\"\'<>\s]*',
              r'go\.isclix\.com/deep_link(?:/v6)?/\d+/\d+',
              r'fast\.accesstrade\.com\.vn/deep_link/\d+',
          ]
          found=[]
          for p in pats:
              found += re.findall(p,decoded,re.I)
          for x in dict.fromkeys(found): print(x[:2000])
          print('=== 19-DIGIT IDS NEAR TRACKING ===')
          for m in re.finditer(r'(?:go\.isclix\.com|fast\.accesstrade\.com\.vn).{0,300}',decoded,re.I|re.S):
              ids=re.findall(r'\b\d{16,20}\b',m.group(0))
              if ids: print(ids, re.sub(r'\s+',' ',m.group(0))[:700])
          print('=== SCRIPT SRCS ===')
          for src in re.findall(r'<script[^>]+src=[\"\']([^\"\']+)',decoded,re.I): print(src)
          PY
          echo "=== GENERIC MARKERS ==="
          grep -Eio 'deep_link|isclix|pub[_-]?id|publisher[_-]?id|campaign[_-]?id|4751584435713464237|[0-9]{19}' landing.html | sort -u | head -200 || true
