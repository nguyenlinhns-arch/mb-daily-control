name: Optimize 4SO public copy

on:
  push:
    paths:
      - '.github/workflows/optimize-ai-copy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Rewrite public copy
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('ai-methods/index.html')
          s = p.read_text(encoding='utf-8')

          replacements = {
            'Xem gói 01 ngày': 'Gói 30.000đ',
            'Báo cáo dữ liệu AI theo ngày': '4SO AI · Báo cáo theo ngày',
            '<h1>Phân tích dữ liệu Xổ số Miền Bắc bằng AI.</h1>': '<h1>Phân tích dữ liệu<br>Xổ số Miền Bắc bằng AI.</h1>',
            '<p class="hero-lead"><strong>4SO AI sử dụng kết quả đã công bố đến hết ngày hôm qua</strong> để thực hiện thống kê, backtest, chấm đủ 45 cặp đảo và xếp hạng hai cặp đầu ra của mô hình cho báo cáo ngày kế tiếp.</p>': '<p class="hero-lead"><strong>4SO AI chỉ sử dụng kết quả đã công bố đến hết ngày hôm qua.</strong> Mỗi ngày, hệ thống chấm đủ 45 cặp đảo, xếp hạng Top 1–Top 2 và lưu đầu ra trước khi có kết quả kỳ mới.</p>',
            '<p class="proof-label">Một đợt kiểm định lịch sử</p>': '<p class="proof-label">Kiểm định lịch sử 30 ngày</p>',
            '<span class="proof-title">24/30 ngày có đầu ra xuất hiện</span>': '<span class="proof-title">24/30 ngày<br>có đầu ra xuất hiện</span>',
            'Số liệu lịch sử đã đối chiếu, không phải xác suất bảo đảm và không cam kết cho kỳ tiếp theo.': 'Kết quả đã đối chiếu. Không phải xác suất bảo đảm cho kỳ tiếp theo.',
            '<p class="access-kicker">Quyền truy cập 01 báo cáo</p><h2 id="access-title">Báo cáo ngày <span data-date>--/--/----</span></h2>': '<p class="access-kicker">Báo cáo 01 ngày</p><h2 id="access-title">Ngày <span data-date>--/--/----</span></h2>',
            '<p class="access-desc">Báo cáo gồm dữ liệu nguồn, thống kê, backtest, xếp hạng Top 1–Top 2 và hồ sơ đối chiếu. Ngày báo cáo kế tiếp được khóa theo dữ liệu t−1.</p>': '<p class="access-desc">Dữ liệu khóa đến t−1. Gồm thống kê, backtest, Top 1–Top 2 và lịch sử đối chiếu.</p>',
            '<div class="price-line"><span>Phí quyền truy cập một báo cáo</span><strong>30.000đ</strong></div>': '<div class="price-line"><span>Phí sử dụng 01 ngày</span><strong>30.000đ</strong></div>',
            'Xem hướng dẫn truy cập →': 'Xem cách nhận báo cáo →',
            'Phí dịch vụ dữ liệu · Không phải tiền đặt cược · Chỉ dành cho người từ 18 tuổi': 'Dịch vụ dữ liệu 18+ · Không nhận cược · Không trả thưởng',
            '<strong>Không dùng kết quả tương lai</strong><span>Dữ liệu báo cáo ngày <span data-date>--/--/----</span> được khóa đến <span data-lock-date>--/--/----</span>.</span>': '<strong>Khóa dữ liệu đến t−1</strong><span>Báo cáo ngày <span data-date>--/--/----</span> chỉ dùng dữ liệu đến <span data-lock-date>--/--/----</span>.</span>',
            '<strong>Đối chiếu công khai</strong><span>Đầu ra mô hình và kết quả thực tế được lưu theo từng ngày.</span>': '<strong>Lịch sử công khai</strong><span>Đầu ra và kết quả thực tế được đối chiếu theo từng ngày.</span>',
            '<p class="offer-badge">Gói báo cáo nghiên cứu AI 4SO</p><h2><strong>30.000đ</strong> cho quyền xem một báo cáo dữ liệu</h2>': '<p class="offer-badge">4SO AI · Gói theo ngày</p><h2>Truy cập đầy đủ<br><strong>30.000đ / ngày</strong></h2>',
            '<p class="offer-lead">Mỗi báo cáo tổng hợp từ hơn <strong>15.000 lượt tính toán thống kê</strong>, các lớp phương pháp nghiên cứu và hồ sơ kiểm định trước khi công bố đầu ra.</p>': '<p class="offer-lead">Mỗi ngày, hệ thống tổng hợp hơn <strong>15.000 lượt tính toán thống kê</strong> từ 7 lớp phương pháp trước khi công bố xếp hạng.</p>',
            '<li>Dữ liệu khóa đến ngày hôm qua <strong>(<span data-lock-date>--/--/----</span>)</strong></li><li>Thống kê, backtest và hồ sơ kiểm định</li><li>Xếp hạng thống kê Top 1–Top 2</li><li>Lịch sử đối chiếu theo từng ngày</li>': '<li>Dữ liệu khóa đến t−1 <strong>(<span data-lock-date>--/--/----</span>)</strong></li><li>Thống kê &amp; backtest</li><li>Top 1–Top 2 theo công thức đã khóa</li><li>Lịch sử đối chiếu công khai</li>',
            '<div class="offer-price"><span>Phí truy cập<br>01 báo cáo / 01 ngày</span><strong>30.000đ</strong></div>': '<div class="offer-price"><span>Phí sử dụng<br>01 ngày</span><strong>30.000đ</strong></div>',
            'Xem thông tin truy cập →': 'Xem cách truy cập →',
            'Không tư vấn mức tiền đặt cược và không cung cấp dịch vụ cá cược.': 'Phí dịch vụ dữ liệu. Không phải tiền đặt cược.',
            '<p class="section-kicker">Dữ kiện đã đối chiếu</p><h2 class="section-title">Hiệu suất lịch sử tháng 7–8/2026</h2><p class="section-intro">Đầu ra mô hình được lưu trước kỳ và đối chiếu với đủ 27 mã kết quả. Dữ liệu bên dưới cập nhật đến hết 09/08/2026.</p>': '<p class="section-kicker">Kết quả đã đối chiếu</p><h2 class="section-title">Kết quả theo từng giai đoạn</h2><p class="section-intro">Khung 80% phía trên là một đợt kiểm định 30 ngày. Bảng dưới đây hiển thị toàn bộ dữ liệu đã đối chiếu từ 01/07 đến 09/08/2026 nên tỷ lệ có thể khác.</p>',
            '<p class="definition"><strong>Định nghĩa:</strong> “Ngày có đầu ra xuất hiện” là ngày có ít nhất 1 trong 4 đầu ra của MB_4SO_V1 xuất hiện trong 27 mã kết quả. Đây là thống kê lịch sử, không phải tỷ lệ bảo đảm cho kỳ tiếp theo.</p>': '<p class="definition"><strong>Cách tính:</strong> một ngày được ghi nhận khi có ít nhất 1 trong 4 đầu ra xuất hiện trong 27 mã kết quả. Tất cả tỷ lệ trên trang đều là số liệu lịch sử.</p>',
            '<p class="section-kicker">Nội dung báo cáo</p><h2 class="section-title">Bạn nhận được những gì?</h2><p class="section-intro">Quyền truy cập áp dụng cho đúng báo cáo/ngày đã chọn và tập trung vào dữ liệu, phương pháp và hồ sơ đối chiếu.</p>': '<p class="section-kicker">Nội dung báo cáo</p><h2 class="section-title">Trong báo cáo có gì?</h2><p class="section-intro">Một trang gọn: dữ liệu đầu vào, kiểm định, bảng xếp hạng và lịch sử đối chiếu của đúng ngày đã chọn.</p>',
            '<p class="section-kicker">Cách đọc bảng xếp hạng</p><h2 class="section-title">Top 1 và Top 2 là thứ hạng thống kê</h2><p class="section-intro">Hai vị trí thể hiện thứ tự xếp hạng của mô hình. Website không dùng các vị trí này để hướng dẫn số tiền, tỷ lệ vốn hoặc cách đặt cược.</p>': '<p class="section-kicker">Cách đọc bảng xếp hạng</p><h2 class="section-title">Top 1 – Top 2<br>chỉ là thứ hạng mô hình</h2><p class="section-intro">Hai vị trí cho biết thứ tự xếp hạng theo công thức thống kê. Không phải hướng dẫn mức tiền hoặc cách đặt cược.</p>',
            '<div><p class="section-kicker">Hồ sơ công khai</p><h2 class="section-title">Đầu ra và kết quả từng ngày</h2><p class="section-intro">Xem bốn đầu ra đã lưu, mã thực tế xuất hiện và số lần xuất hiện. Kết quả được đối chiếu sau kỳ.</p></div>': '<div><p class="section-kicker">Hồ sơ công khai</p><h2 class="section-title">Lịch sử đầu ra theo ngày</h2><p class="section-intro">Đầu ra được lưu trước kỳ; kết quả được đối chiếu sau kỳ.</p></div>',
            '<p class="section-kicker">Quy trình truy cập</p><h2 class="section-title">Ba bước rõ ràng</h2>': '<p class="section-kicker">Quy trình truy cập</p><h2 class="section-title">3 bước để truy cập</h2>',
            '<h3>Chọn ngày báo cáo</h3><p>Hiện tại chỉ mở báo cáo cho ngày kế tiếp theo múi giờ Việt Nam.</p>': '<h3>Chọn ngày</h3><p>Hệ thống hiển thị báo cáo cho ngày kế tiếp theo giờ Việt Nam.</p>',
            '<h3>Đọc và đồng ý điều khoản</h3><p>Xác nhận từ 18 tuổi, hiểu đây là dịch vụ dữ liệu và không phải dịch vụ cá cược.</p>': '<h3>Xác nhận điều khoản</h3><p>Xác nhận đủ 18 tuổi và hiểu đây là dịch vụ dữ liệu.</p>',
            '<h3>Thanh toán và xác nhận</h3><p>Chuyển phí truy cập 30.000đ và gửi ảnh giao dịch qua Zalo để đối soát.</p>': '<h3>Thanh toán 30.000đ</h3><p>Chuyển phí và gửi ảnh giao dịch qua Zalo để đối soát.</p>',
            '<p class="section-kicker">Bảo vệ người dùng</p><h2 class="section-title">Phạm vi dịch vụ được giới hạn rõ</h2>': '<p class="section-kicker">Phạm vi dịch vụ</p><h2 class="section-title">Giới hạn rõ ràng</h2>',
            '<section class="closing wrap"><p class="section-kicker">Quyền truy cập 01 ngày</p><h2>Báo cáo ngày <span data-date>--/--/----</span></h2><p>Đọc điều khoản, xác nhận từ 18 tuổi và xem hướng dẫn thanh toán phí truy cập 30.000đ.</p><button type="button" data-open>Xem hướng dẫn truy cập →</button></section>': '<section class="closing wrap"><p class="section-kicker">Báo cáo 4SO AI</p><h2>Ngày <span data-date>--/--/----</span></h2><p>Phí sử dụng 30.000đ/ngày. Xác nhận đủ 18 tuổi và đọc điều khoản trước khi thanh toán.</p><button type="button" data-open>Xem cách nhận báo cáo →</button></section>',
            '<div class="mobile-bar"><div><span>Báo cáo <span data-date>--/--/----</span></span><strong>30.000đ / báo cáo</strong></div><button type="button" data-open>Chi tiết</button></div>': '<div class="mobile-bar"><div><span>4SO AI · <span data-date>--/--/----</span></span><strong>30.000đ / ngày</strong></div><button type="button" data-open>Xem</button></div>',
            '<p class="section-kicker">Quyền truy cập báo cáo</p><h2 id="dialog-title">Báo cáo AI ngày <span data-date>--/--/----</span></h2><p class="dialog-intro">30.000đ là phí dịch vụ dữ liệu và phân tích AI, không phải tiền đặt cược. Vui lòng đọc và xác nhận điều khoản trước khi xem thông tin thanh toán.</p>': '<p class="section-kicker">Báo cáo 4SO AI</p><h2 id="dialog-title">Ngày <span data-date>--/--/----</span></h2><p class="dialog-intro">Phí sử dụng 30.000đ/ngày. Đây là dịch vụ dữ liệu, không phải tiền đặt cược.</p>',
            '<div class="payrow"><span>Phí truy cập 01 báo cáo</span><strong>30.000đ</strong></div>': '<div class="payrow"><span>Phí sử dụng 01 ngày</span><strong>30.000đ</strong></div>',
            '<li><span>1</span>Chuyển phí quyền truy cập 30.000đ.</li>': '<li><span>1</span>Chuyển phí sử dụng 30.000đ.</li>'
          }

          for old, new in replacements.items():
              if old not in s:
                  print('WARN missing:', old[:100])
              s = s.replace(old, new)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate copy
        run: |
          grep -q 'proof-value">80%' ai-methods/index.html
          grep -q '30.000đ / ngày' ai-methods/index.html
          grep -q 'Khung 80% phía trên là một đợt kiểm định 30 ngày' ai-methods/index.html
          if grep -q '50.000đ' ai-methods/index.html; then exit 1; fi
      - name: Commit changes
        run: |
          if git diff --quiet -- ai-methods/index.html; then
            echo 'No changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai-methods/index.html
          git commit -m 'Refine 4SO website copy and line breaks'
          git push origin HEAD:main
