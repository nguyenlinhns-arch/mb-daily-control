<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#071b2b">
  <title>Báo cáo MB 4SO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{--navy:#071b2b;--navy2:#0d2a3f;--ink:#102333;--muted:#60727c;--paper:#f7f9fa;--card:#fff;--line:#dbe4e8;--soft:#edf2f4;--lime:#d7ff55;--green:#26704a;--greenSoft:#e4f4e9;--orange:#ed5b34;--red:#934338;--redSoft:#f7e6e3;--blue:#0878f9;--font:"Be Vietnam Pro","Segoe UI",Arial,sans-serif;--shadow:0 18px 48px rgba(7,27,43,.10)}
    *{box-sizing:border-box}html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}body{margin:0;min-width:320px;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.62;-webkit-font-smoothing:antialiased}.wrap{width:min(calc(100% - 28px),1080px);margin-inline:auto}button{font:inherit;cursor:pointer}a{color:inherit}.num{font-variant-numeric:tabular-nums lining-nums}.muted{color:var(--muted)}
    .header{position:sticky;top:0;z-index:50;border-bottom:1px solid rgba(219,228,232,.9);background:rgba(247,249,250,.94);backdrop-filter:blur(16px)}.header-in{min-height:70px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:0}.mark{width:46px;height:46px;display:grid;place-items:center;border-radius:14px;background:var(--navy);color:var(--lime);font-size:14px;font-weight:900;box-shadow:0 8px 20px rgba(7,27,43,.16)}.brand-copy{display:grid;line-height:1.2}.brand-copy strong{font-size:17px}.brand-copy span{margin-top:3px;color:var(--muted);font-size:12px}.tools{display:flex;gap:8px}.tool{min-height:46px;padding:0 13px;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--navy);font-weight:800}.tool.primary{border-color:var(--navy);background:var(--navy);color:#fff}.print-short{display:none}
    .hero{padding:34px 0 52px;display:grid;gap:22px}.eyebrow{width:max-content;max-width:100%;margin:0 0 12px;padding:7px 11px;border:1px solid var(--line);border-radius:999px;background:#fff;color:#4d6571;font-size:12px;font-weight:850;letter-spacing:.03em}.hero h1{margin:0;font-size:clamp(38px,11vw,66px);line-height:1.02;letter-spacing:-.055em}.hero-lead{margin:15px 0 0;color:#50636f;font-size:17px}.meta-row{margin-top:18px;display:flex;flex-wrap:wrap;gap:8px}.meta-pill{padding:8px 10px;border:1px solid var(--line);border-radius:999px;background:#fff;color:#4e6571;font-size:12px;font-weight:800}.meta-pill strong{color:var(--navy)}
    .signal-panel{padding:18px;border-radius:28px;background:var(--navy);color:#fff;box-shadow:0 24px 60px rgba(7,27,43,.20)}.signal-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.signal-kicker{margin:0;color:#c3d1d7;font-size:12px;font-weight:850;letter-spacing:.06em;text-transform:uppercase}.stage{padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.09);color:#dce6ea;font-size:12px;font-weight:850}.stage.published{background:var(--lime);color:var(--navy)}.signal-title{margin:11px 0 0;font-size:26px;line-height:1.2}.pairs{margin-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:10px}.pair{padding:18px 12px;border-radius:18px;background:linear-gradient(135deg,var(--lime),#edffae);color:var(--navy);text-align:center}.pair small{display:block;font-size:11px;font-weight:850;letter-spacing:.05em;text-transform:uppercase}.pair strong{display:block;margin-top:8px;font-size:31px;line-height:1;font-weight:900;letter-spacing:-.045em}.codes{margin-top:10px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.code{min-height:58px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.13);border-radius:14px;background:rgba(255,255,255,.06);color:#fff;font-size:22px;font-weight:900}.conclusion{margin-top:16px;padding:15px;border:1px solid rgba(255,255,255,.14);border-radius:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:rgba(255,255,255,.05)}.conclusion span{color:#c6d2d8;font-size:13px}.conclusion strong{color:var(--lime);font-size:22px;font-weight:900}
    .section{padding:58px 0}.section.soft{background:#eaf0f2}.section.dark{background:var(--navy);color:#fff}.kicker{margin:0 0 7px;color:var(--orange);font-size:12px;font-weight:900;letter-spacing:.07em;text-transform:uppercase}.dark .kicker{color:var(--lime)}.section h2{margin:0;font-size:clamp(29px,8vw,44px);line-height:1.1;letter-spacing:-.04em}.intro{max-width:760px;margin:12px 0 0;color:var(--muted);font-size:15px}.dark .intro{color:#c3d0d6}
    .quick-grid,.audit-grid,.capital-grid{margin-top:22px;display:grid;gap:10px}.quick-card,.audit-card,.capital-card{padding:18px;border:1px solid var(--line);border-radius:18px;background:#fff}.quick-card span,.capital-card span{display:block;color:var(--muted);font-size:12px;font-weight:750}.quick-card strong,.capital-card strong{display:block;margin-top:6px;font-size:18px;line-height:1.25}.quick-card strong.pass{color:var(--green)}
    .rank-wrap{margin-top:22px;overflow:hidden;border:1px solid var(--line);border-radius:20px;background:#fff}.rank-row{padding:16px;display:grid;grid-template-columns:46px minmax(82px,1fr) repeat(3,minmax(74px,.85fr));gap:8px;align-items:center;border-bottom:1px solid var(--line)}.rank-row:last-child{border-bottom:0}.rank-row.head{background:var(--soft);color:#536975;font-size:11px;font-weight:850;text-transform:uppercase}.rank{width:36px;height:36px;display:grid;place-items:center;border-radius:11px;background:var(--navy);color:var(--lime);font-weight:900}.rank-pair{font-size:19px;font-weight:900}.metric{font-size:14px;color:#425b68}.metric strong{display:block;color:var(--ink);font-size:15px}.metric span{display:block;margin-top:2px;color:var(--muted);font-size:10px}
    .audit-grid{grid-template-columns:1fr 1fr}.audit-card{display:flex;align-items:center;justify-content:space-between;gap:10px}.audit-card span{color:#536874;font-size:12px;font-weight:750}.audit-card b{padding:6px 8px;border-radius:999px;background:var(--soft);font-size:11px}.audit-card b.pass{background:var(--greenSoft);color:var(--green)}.audit-card b.fail{background:var(--redSoft);color:var(--red)}
    .hash-card{margin-top:14px;padding:18px;border:1px solid rgba(255,255,255,.12);border-radius:18px;background:rgba(255,255,255,.05)}.hash-grid{display:grid;gap:14px}.hash-item span{display:block;color:#aebdc4;font-size:11px;font-weight:750}.hash-item code{display:block;margin-top:5px;color:#fff;font:700 12px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace;overflow-wrap:anywhere}.source-line{margin-top:18px;padding:14px;border-radius:14px;background:rgba(215,255,85,.08);color:#dce6e9;font-size:13px}.source-line strong{color:var(--lime)}
    .capital-grid{grid-template-columns:1fr 1fr}.capital-card.feature{grid-column:1/-1;background:var(--navy);color:#fff;border-color:var(--navy)}.capital-card.feature span{color:#b8c8cf}.capital-card.feature strong{color:var(--lime);font-size:26px}.allocation{margin-top:12px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.alloc{padding:12px 5px;border-radius:12px;background:rgba(255,255,255,.07);text-align:center}.alloc b{display:block;color:#fff;font-size:20px}.alloc small{display:block;margin-top:4px;color:#b9c8cf;font-size:10px}
    .method{margin-top:22px;padding:20px;border:1px solid var(--line);border-radius:20px;background:#fff}.method-line{display:grid;gap:8px}.formula{padding:14px;border-radius:14px;background:var(--navy);color:#fff;font:700 12px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace;overflow-wrap:anywhere}.method ul{margin:14px 0 0;padding-left:20px;color:#526772;font-size:14px}.method li+li{margin-top:7px}
    .note{margin-top:22px;padding:16px;border-left:5px solid var(--orange);border-radius:0 14px 14px 0;background:#fff;color:#52656f;font-size:13px}.dark-note{margin-top:22px;padding:16px;border:1px solid rgba(255,255,255,.12);border-radius:16px;background:rgba(255,255,255,.05);color:#c7d3d8;font-size:13px}.dark-note strong{color:var(--lime)}
    .footer{padding:24px 0 80px;border-top:1px solid var(--line);color:#6b7c84;font-size:12px}.footer-in{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}.footer strong{color:var(--ink)}
    .loading{padding:80px 20px;text-align:center;color:var(--muted)}.error{margin:24px 0;padding:18px;border:1px solid #e8c6bf;border-radius:16px;background:#fff1ee;color:#7e3e35}
    @media(min-width:680px){.quick-grid{grid-template-columns:repeat(4,1fr)}.audit-grid{grid-template-columns:repeat(3,1fr)}.capital-grid{grid-template-columns:repeat(4,1fr)}.capital-card.feature{grid-column:span 2}.hash-grid{grid-template-columns:repeat(3,1fr)}}
    @media(min-width:840px){.hero{padding:64px 0 72px;grid-template-columns:minmax(0,1fr) minmax(390px,.9fr);gap:54px;align-items:start}.signal-panel{padding:22px}.section{padding:78px 0}.rank-row{grid-template-columns:54px 1.1fr repeat(3,1fr);padding:17px 20px}.tools .tool{min-width:110px}}
    @media(max-width:520px){#copyCodes{display:none}.tools .print-label{display:none}.print-short{display:inline}.rank-row{grid-template-columns:42px 1fr 1fr}.rank-row.head{display:none}.rank-row .metric:nth-child(4),.rank-row .metric:nth-child(5){grid-column:2/4}.audit-grid{grid-template-columns:1fr}.capital-grid{grid-template-columns:1fr 1fr}.allocation{grid-template-columns:1fr 1fr}.hero h1{font-size:41px}.pair strong{font-size:27px}.code{font-size:20px}}
    @media print{.header,.tool,.tools{display:none!important}body{background:#fff}.hero,.section{padding:24px 0}.signal-panel,.capital-card.feature,.formula{print-color-adjust:exact;-webkit-print-color-adjust:exact}.wrap{width:100%;max-width:none;padding:0 12mm}.footer{padding-bottom:0}.section.soft{background:#fff}.section{break-inside:avoid}.rank-wrap,.method,.hash-card{break-inside:avoid}}
  </style>
</head>
<body>
  <header class="header"><div class="header-in wrap"><a class="brand" href="./"><span class="mark">4SO</span><span class="brand-copy"><strong>MB 4SO</strong><span>Báo cáo vận hành theo ngày</span></span></a><div class="tools"><button class="tool" id="copyCodes" type="button">Sao chép 4 số</button><button class="tool primary" type="button" onclick="window.print()"><span class="print-label">In / PDF</span><span class="print-short">PDF</span></button></div></div></header>
  <main id="app"><div class="loading wrap">Đang tải báo cáo MB 4SO…</div></main>
  <script>
    const fmt=v=>v===null||v===undefined||v===''?'—':v;
    const pct=v=>v===null||v===undefined?'—':`${(Number(v)*100).toFixed(1).replace('.0','')}%`;
    const score=v=>v===null||v===undefined?'—':Number(v).toFixed(6);
    const money=v=>v===null||v===undefined?'—':new Intl.NumberFormat('vi-VN').format(v)+'đ';
    const auditClass=v=>String(v).toUpperCase()==='PASS'?'pass':String(v).toUpperCase().includes('FAIL')?'fail':'';
    const pairText=(pairs,i)=>pairs?.[i]||'—';
    const codes4=codes=>[0,1,2,3].map(i=>codes?.[i]||'—');
    const render=report=>{
      const published=String(report.report_stage).toUpperCase()==='PUBLISHED';
      const codes=codes4(report.final_codes);
      const top3=(report.top3||[]).slice(0,3);
      const audit=report.audit||{};
      document.title=`MB 4SO · ${fmt(report.target_date)}`;
      document.querySelector('#app').innerHTML=`
      <section class="hero wrap">
        <div><p class="eyebrow">MB 4SO · Báo cáo theo ngày</p><h1>Báo cáo ngày<br><span class="num">${fmt(report.target_date)}</span></h1><p class="hero-lead">Dữ liệu được khóa đến <strong>${fmt(report.data_lock)}</strong>. Báo cáo chỉ dùng thông tin có trước kỳ, chấm đủ 45 cặp và công bố đúng 2 cặp đứng đầu khi audit PASS.</p><div class="meta-row"><span class="meta-pill">Method <strong>${fmt(report.method_id)}</strong></span><span class="meta-pill">Config <strong>${fmt(report.active_config)}</strong></span><span class="meta-pill">Data Lock <strong>${fmt(report.data_lock)}</strong></span></div></div>
        <section class="signal-panel"><div class="signal-head"><p class="signal-kicker">Tín hiệu canonical</p><span class="stage ${published?'published':''}">${fmt(report.report_stage)}</span></div><h2 class="signal-title">2 cặp · 4 số</h2><div class="pairs"><div class="pair"><small>Top 1</small><strong>${pairText(report.final_pairs,0)}</strong></div><div class="pair"><small>Top 2</small><strong>${pairText(report.final_pairs,1)}</strong></div></div><div class="codes">${codes.map(c=>`<span class="code">${c}</span>`).join('')}</div><div class="conclusion"><span>Kết luận phiên</span><strong>${fmt(report.conclusion)}</strong></div></section>
      </section>

      <section class="section soft"><div class="wrap"><p class="kicker">Trạng thái nhanh</p><h2>Nhìn 10 giây là đủ</h2><p class="intro">Các điều kiện cốt lõi phải đồng thời đạt trước khi tín hiệu được xem là PUBLISHED.</p><div class="quick-grid"><div class="quick-card"><span>Nguồn dữ liệu</span><strong>${fmt(report.source_status)}</strong></div><div class="quick-card"><span>No look-ahead</span><strong class="${auditClass(audit.no_look_ahead)}">${fmt(audit.no_look_ahead)}</strong></div><div class="quick-card"><span>Tie Audit</span><strong class="${auditClass(audit.tie_audit)}">${fmt(audit.tie_audit)}</strong></div><div class="quick-card"><span>Readback</span><strong class="${auditClass(audit.readback)}">${fmt(audit.readback)}</strong></div></div></div></section>

      <section class="section"><div class="wrap"><p class="kicker">Bảng xếp hạng</p><h2>Top 3 cặp mạnh nhất</h2><p class="intro">Top 1 và Top 2 tạo tín hiệu canonical. Top 3 được hiển thị để kiểm tra khoảng cách thứ hạng và audit.</p><div class="rank-wrap"><div class="rank-row head"><span>Hạng</span><span>Cặp</span><span>Score</span><span>HitRate60</span><span>Gap</span></div>${top3.map(r=>`<div class="rank-row"><span class="rank">${fmt(r.rank)}</span><span class="rank-pair">${fmt(r.pair)}</span><span class="metric"><strong>${score(r.score)}</strong><span>Score</span></span><span class="metric"><strong>${pct(r.hit_rate_60)}</strong><span>HitRate60</span></span><span class="metric"><strong>${fmt(r.gap)}</strong><span>Gap</span></span></div>`).join('')}</div></div></section>

      <section class="section dark"><div class="wrap"><p class="kicker">Audit kỹ thuật</p><h2>Dữ liệu & hash</h2><p class="intro">Báo cáo chỉ hợp lệ khi dữ liệu, cấu hình, executor và toàn bộ kiểm tra vận hành khớp tuyệt đối.</p><div class="audit-grid">${Object.entries(audit).map(([k,v])=>`<div class="audit-card"><span>${k.replaceAll('_',' ')}</span><b class="${auditClass(v)}">${fmt(v)}</b></div>`).join('')}</div><div class="hash-card"><div class="hash-grid"><div class="hash-item"><span>Source hash</span><code>${fmt(report.source_hash)}</code></div><div class="hash-item"><span>Config hash</span><code>${fmt(report.config_hash)}</code></div><div class="hash-item"><span>Executor hash</span><code>${fmt(report.executor_hash)}</code></div></div><div class="source-line"><strong>Nguồn:</strong> ${fmt(report.source_name)} · tab ${fmt(report.source_tab)} · ${fmt(report.source_status)}</div></div><div class="dark-note"><strong>Challenger:</strong> ${fmt(report.challenger_status)}</div></div></section>

      <section class="section soft"><div class="wrap"><p class="kicker">Vốn & vận hành</p><h2>Capital Gate</h2><p class="intro">Mức vốn được khóa trước kết quả. Không gấp thếp, không thêm số ngoài 2 cặp canonical.</p><div class="capital-grid"><div class="capital-card"><span>Risk State</span><strong>${fmt(report.risk_state)}</strong></div><div class="capital-card"><span>Capital Gate</span><strong>${fmt(report.capital_gate)}</strong></div><div class="capital-card"><span>Điểm / số</span><strong>${fmt(report.points_per_code)} điểm</strong></div><div class="capital-card"><span>Tổng điểm</span><strong>${fmt(report.total_points)} điểm</strong></div><div class="capital-card feature"><span>Tổng vốn phiên</span><strong>${money(report.total_capital_vnd)}</strong><div class="allocation">${codes.map(c=>`<div class="alloc"><b>${c}</b><small>${fmt(report.points_per_code)} điểm</small></div>`).join('')}</div></div></div></div></section>

      <section class="section"><div class="wrap"><p class="kicker">Phương pháp</p><h2>MB_4SO_V1</h2><p class="intro">Mỗi ngày mô hình tạo đúng 45 cặp đảo duy nhất, chấm điểm bằng dữ liệu đến t−1 rồi chọn đúng Top 1 và Top 2.</p><div class="method"><div class="method-line"><div class="formula">Score(pair) = RankPct(HitRate60) + 0.25 × RankPct(log(1 + Gap))</div><div class="formula">Tie-break = 1e−6×HitRate60 + 1e−7×HitRate21 + 1e−8×Occurrence21 + 1e−9×OccurrenceAll + 1e−10×HitRate365</div></div><ul><li>Không dùng kết quả ngày t khi chọn số ngày t.</li><li>Chấm đủ 45/45 cặp bằng float64.</li><li>Không phá hòa bằng cảm tính; hòa trong 1e−12 → TIE_REVIEW.</li><li>Tín hiệu PUBLISHED không sửa sau khi biết kết quả.</li></ul></div><div class="note"><strong>Lưu ý:</strong> backtest và kết quả lịch sử không phải xác suất bảo đảm cho kỳ tiếp theo. Báo cáo này là hồ sơ vận hành của mô hình.</div></div></section>

      <footer class="footer"><div class="footer-in wrap"><div><strong>4SO AI · MB 4SO</strong><br><span>Canonical Algorithm: ${fmt(report.canonical_algorithm)}</span></div><div style="text-align:right">Published: ${fmt(report.published_at)}<br>${fmt(report.note)}</div></div></footer>`;
      document.querySelector('#copyCodes').onclick=async()=>{const text=codes.filter(x=>x!=='—').join(', ');if(!text)return;try{await navigator.clipboard.writeText(text);document.querySelector('#copyCodes').textContent='Đã chép'}catch{}setTimeout(()=>document.querySelector('#copyCodes').textContent='Sao chép 4 số',1400)};
    };
    fetch('./report-data.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Không đọc được dữ liệu báo cáo');return r.json()}).then(render).catch(err=>{document.querySelector('#app').innerHTML=`<div class="wrap error"><strong>Không thể tải báo cáo.</strong><br>${err.message}</div>`});
  </script>
</body>
</html>
