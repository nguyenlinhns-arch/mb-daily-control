name: Deploy historical data report site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  test-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test site
        run: npm test

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build static artifact
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp site-v2/index.html _site/
          cp site-v2/styles.css _site/
          cp site-v2/app.js _site/
          cp site-v2/config.js _site/
          cp site-v2/mau-bao-cao.html _site/
          cp site-v2/legal.html _site/
          cp site-v2/404.html _site/
          cp site-v2/robots.txt _site/
          cp site-v2/sitemap.xml _site/
          cp site-v2/favicon.svg _site/
          cp site-v2/og.png _site/
          cp data/source-access.json _site/
          touch _site/.nojekyll
          test ! -e _site/approval-backend.gs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
