name: Install premium landing v7
on:
  push:
    paths: ['.github/workflows/install-v7.yml']
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Write v7 and switch deploy
        env:
          V7_GZ_B64: 
        run: |
          python - <<'PY'
          import os,base64,gzip
          from pathlib import Path
          raw=gzip.decompress(base64.b64decode(os.environ['V7_GZ_B64']))
          Path('ai-methods/landing-v7.html').write_bytes(raw)
          p=Path('.github/workflows/pages.yml')
          s=p.read_text(encoding='utf-8').replace('landing-v6.html','landing-v7.html')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify and commit
        run: |
          grep -n 'Thay cảm tính' ai-methods/landing-v7.html
          grep -n 'landing-v7.html' .github/workflows/pages.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai-methods/landing-v7.html .github/workflows/pages.yml
          git commit -m 'Install premium landing v7' || exit 0
          git push origin HEAD:main
