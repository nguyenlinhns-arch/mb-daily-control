name: Verify balanced monetization

on:
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/accesstrade-only-monetization.yml'
      - 'scripts/apply_portal_v3_assets.py'
      - 'scripts/optimize_monetization_placement.py'
      - 'site-v2/ads-tracking.js'
      - 'site-v2/finance-banner.js'
  pull_request:
    branches: ["main"]
    paths:
      - '.github/workflows/accesstrade-only-monetization.yml'
      - 'scripts/apply_portal_v3_assets.py'
      - 'scripts/optimize_monetization_placement.py'
      - 'site-v2/ads-tracking.js'
      - 'site-v2/finance-banner.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate monetization contract
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply_portal_v3_assets.py --self-test
          python scripts/optimize_monetization_placement.py --self-test
          node --check site-v2/ads-tracking.js
          node --check site-v2/finance-banner.js

          # ACCESSTRADE placements remain active.
          grep -q 'affiliate-shopee-smartlink' scripts/apply_portal_v3_assets.py
          grep -q 'go.isclix.com/deep_link' site-v2/finance-banner.js
          grep -q 'home_upper_after_header' site-v2/finance-banner.js
          grep -q 'Từ 1,2%/tháng · Đăng ký ban đầu chỉ cần Căn cước công dân' site-v2/finance-banner.js

          # Adsterra remains active but controlled: native is lazy; 300x250 is below purchase CTA.
          grep -q 'effectivecpmnetwork.com' scripts/apply_portal_v3_assets.py
          grep -q 'highperformanceformat.com' scripts/apply_portal_v3_assets.py
          grep -q 'data-lm-native-ad-src' scripts/optimize_monetization_placement.py
          grep -q 'BANNER_ID=' scripts/optimize_monetization_placement.py
          grep -q 'BUY_MARKER=' scripts/optimize_monetization_placement.py
          grep -q 'IntersectionObserver' site-v2/ads-tracking.js
          grep -q 'ad_slot_view' site-v2/ads-tracking.js
          grep -q 'affiliate_click' site-v2/ads-tracking.js

          # SEO discovery links are static in production output.
          grep -q 'data-seo-discovery-links' scripts/optimize_monetization_placement.py
          grep -q '/xsmb-30-ngay/' scripts/optimize_monetization_placement.py
          grep -q '/nguon-du-lieu-xsmb/' scripts/optimize_monetization_placement.py

          echo MONETIZATION_INTEGRITY_OK
