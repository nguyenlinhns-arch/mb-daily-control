name: V6 readability polish
on:
  push:
    paths: ['.github/workflows/v6-readable-type.yml']
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Increase small-text readability
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('ai-methods/landing-v6.html')
          s=p.read_text(encoding='utf-8')
          css='''.proof-label{font-size:10px}.proof-copy span{font-size:11px}.proof-note{font-size:9px}.proof-action{font-size:11px}.hero-meta{font-size:11px}.nav a{font-size:11px}.header-cta{font-size:11px}.metric span{font-size:10px}.intro{font-size:14px}.sample-row span{font-size:12px}.report-top span,.report-top b{font-size:9px}.report-meta span{font-size:8px}.result{font-size:10px}.report-actions a,.report-actions button{font-size:11px}.plan-tag{font-size:9px}.plan-desc{font-size:11px}.plan button{font-size:10px}.trust-line strong{font-size:11px}.trust-line span{font-size:10px}.method-row b{font-size:10px}.method-row span{font-size:10px}.history-item span{font-size:10px}.history-item small{font-size:9px}.history-note{font-size:10px}.faq summary{font-size:12px}.faq p{font-size:10px}.legal-links a{font-size:9px}.mobile-bar span{font-size:9px}.mobile-bar strong{font-size:14px}.mobile-bar button{font-size:11px}.dialog-kicker{font-size:9px}.dialog-intro{font-size:10px}.modal-plan b{font-size:9px}.modal-plan strong{font-size:12px}.payrow span{font-size:9px}.payrow strong{font-size:13px}.copy{font-size:9px}.copy-all{font-size:10px}.checkout-note{font-size:9px}.zalo{font-size:11px}.terms{font-size:8px}'''
          if '/* readability-polish */' not in s:
              s=s.replace('</style>','    /* readability-polish */\n    '+css+'\n  </style>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify and commit
        run: |
          grep -n 'readability-polish' ai-methods/landing-v6.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai-methods/landing-v6.html
          git commit -m 'Improve v6 mobile typography readability' || exit 0
          git push origin HEAD:main
