<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#071b2b">
  <title>Báo cáo MB 4SO - Bản chia sẻ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{--navy:#071b2b;--navy2:#0d2a3f;--ink:#102333;--muted:#60727c;--paper:#f7f9fa;--card:#fff;--line:#dbe4e8;--soft:#edf2f4;--lime:#d7ff55;--green:#26704a;--greenSoft:#e4f4e9;--orange:#ed5b34;--font:"Be Vietnam Pro","Segoe UI",Arial,sans-serif}
    *{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;min-width:320px;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}.wrap{width:min(calc(100% - 28px),980px);margin-inline:auto}.num{font-variant-numeric:tabular-nums lining-nums}button{font:inherit;cursor:pointer}
    .header{position:sticky;top:0;z-index:20;border-bottom:1px solid rgba(219,228,232,.9);background:rgba(247,249,250,.95);backdrop-filter:blur(15px)}.header-in{min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px}.mark{width:44px;height:44px;display:grid;place-items:center;border-radius:13px;background:var(--navy);color:var(--lime);font-size:13px;font-weight:900}.brand-copy{display:grid;line-height:1.2}.brand-copy strong{font-size:16px}.brand-copy span{margin-top:3px;color:var(--muted);font-size:11px}.pdf{min-height:44px;padding:0 14px;border:0;border-radius:12px;background:var(--navy);color:#fff;font-weight:850}
    .hero{padding:34px 0 44px;display:grid;gap:22px}.eyebrow{width:max-content;max-width:100%;margin:0 0 12px;padding:7px 10px;border:1px solid var(--line);border-radius:999px;background:#fff;color:#4f6671;font-size:11px;font-weight:850;letter-spacing:.04em}.hero h1{margin:0;font-size:clamp(38px,11vw,62px);line-height:1.02;letter-spacing:-.055em}.lead{margin:14px 0 0;color:#50636f;font-size:16px}.meta{margin-top:16px;display:flex;flex-wrap:wrap;gap:8px}.pill{padding:8px 10px;border:1px solid var(--line);border-radius:999px;background:#fff;color:#536873;font-size:11px;font-weight:800}.pill strong{color:var(--navy)}
    .signal{padding:18px;border-radius:26px;background:var(--navy);color:#fff}.signal-top{display:flex;align-items:center;justify-content:space-between;gap:12px}.signal-top span{color:#bdcbd1;font-size:11px;font-weight:850;letter-spacing:.05em;text-transform:uppercase}.stage{padding:7px 9px;border-radius:999px;background:var(--lime);color:var(--navy)!important;font-weight:900!important;letter-spacing:0!important}.pairs{margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:10px}.pair{padding:17px 10px;border-radius:17px;background:linear-gradient(135deg,var(--lime),#efffb9);color:var(--navy);text-align:center}.pair small{display:block;font-size:10px;font-weight:850;letter-spacing:.05em}.pair strong{display:block;margin-top:7px;font-size:29px;line-height:1;font-weight:900}.codes{margin-top:10px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.code{min-height:56px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.13);border-radius:13px;background:rgba(255,255,255,.06);font-size:21px;font-weight:900}.statusline{margin-top:14px;padding:13px;border:1px solid rgba(255,255,255,.13);border-radius:14px;background:rgba(255,255,255,.05);display:flex;justify-content:space-between;gap:12px}.statusline span{color:#bfccd2;font-size:12px}.statusline b{color:var(--lime)}
    .section{padding:52px 0}.section.soft{background:#eaf0f2}.kicker{margin:0 0 7px;color:var(--orange);font-size:11px;font-weight:900;letter-spacing:.07em;text-transform:uppercase}.section h2{margin:0;font-size:clamp(28px,8vw,40px);line-height:1.1;letter-spacing:-.04em}.intro{max-width:720px;margin:11px 0 0;color:var(--muted);font-size:14px}
    .rankbox{margin-top:20px;overflow:hidden;border:1px solid var(--line);border-radius:18px;background:#fff}.rankrow{padding:15px;display:grid;grid-template-columns:44px 1fr 1fr 1fr;gap:8px;align-items:center;border-bottom:1px solid var(--line)}.rankrow:last-child{border-bottom:0}.rankrow.head{background:var(--soft);color:#586c76;font-size:10px;font-weight:850;text-transform:uppercase}.rank{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;background:var(--navy);color:var(--lime);font-weight:900}.rankpair{font-size:18px;font-weight:900}.metric strong{display:block;font-size:14px}.metric span{display:block;margin-top:2px;color:var(--muted);font-size:10px}
    .audit{margin-top:20px;display:grid;grid-template-columns:1fr 1fr;gap:10px}.check{padding:16px;border:1px solid var(--line);border-radius:16px;background:#fff;display:flex;align-items:center;justify-content:space-between;gap:10px}.check span{color:#566a74;font-size:12px;font-weight:750}.check b{padding:6px 8px;border-radius:999px;background:var(--greenSoft);color:var(--green);font-size:10px}
    .method{margin-top:20px;padding:18px;border:1px solid var(--line);border-radius:18px;background:#fff}.method p{margin:0;color:#536873;font-size:13px}.method p+p{margin-top:9px}.note{margin-top:18px;padding:15px;border-left:5px solid var(--orange);border-radius:0 14px 14px 0;background:#fff;color:#556973;font-size:12px}.footer{padding:22px 0 70px;border-top:1px solid var(--line);color:#71818a;font-size:11px}.footer strong{color:var(--ink)}
    .loading{padding:80px 20px;text-align:center;color:var(--muted)}.error{margin:24px 0;padding:18px;border:1px solid #e9c6c0;border-radius:16px;background:#fff1ee;color:#7f4037}
    @media(min-width:760px){.hero{padding:56px 0 62px;grid-template-columns:minmax(0,1fr) minmax(360px,.9fr);gap:48px;align-items:start}.audit{grid-template-columns:repeat(4,1fr)}.section{padding:68px 0}}
    @media(max-width:520px){.rankrow{grid-template-columns:40px 1fr 1fr}.rankrow.head{display:none}.rankrow .metric:last-child{grid-column:2/4}.audit{grid-template-columns:1fr}.hero h1{font-size:40px}.pair strong{font-size:25px}.pdf{padding:0 11px}}
    @media print{.header{display:none!important}body{background:#fff}.hero,.section{padding:22px 0}.wrap{width:100%;max-width:none;padding:0 10mm}.section.soft{background:#fff}.signal{print-color-adjust:exact;-webkit-print-color-adjust:exact}.rankbox,.method{break-inside:avoid}.footer{padding-bottom:0}}
  </style>
</head>
<body>
  <header class="header"><div class="header-in wrap"><div class="brand"><span class="mark">4SO</span><span class="brand-copy"><strong>MB 4SO</strong><span>Bản báo cáo chia sẻ</span></span></div><button class="pdf" type="button" onclick="window.print()">Xuất PDF</button></div></header>
  <main id="app"><div class="loading wrap">Đang tải báo cáo…</div></main>
  <script>
    const fmt=v=>v===null||v===undefined||v===''?'—':v;
    const pct=v=>v===null||v===undefined?'—':`${(Number(v)*100).toFixed(1).replace('.0','')}%`;
    const pair=(a,i)=>a?.[i]||'—';
    const code=(a,i)=>a?.[i]||'—';
    const render=r=>{
      const top=(r.top3||[]).slice(0,3), a=r.audit||{};
      document.title=`MB 4SO - ${fmt(r.target_date)}`;
      document.querySelector('#app').innerHTML=`
      <section class="hero wrap">
        <div><p class="eyebrow">MB 4SO · Báo cáo theo ngày</p><h1>Báo cáo ngày<br><span class="num">${fmt(r.target_date)}</span></h1><p class="lead">Dữ liệu khóa đến <strong>${fmt(r.data_lock)}</strong>. Đầu ra được tạo từ dữ liệu có trước kỳ và lưu trước khi có kết quả mới.</p><div class="meta"><span class="pill">Phương pháp <strong>${fmt(r.method_id)}</strong></span><span class="pill">Nguồn <strong>${fmt(r.source_status)}</strong></span><span class="pill">Data Lock <strong>${fmt(r.data_lock)}</strong></span></div></div>
        <section class="signal"><div class="signal-top"><span>Kết quả mô hình</span><span class="stage">${String(r.report_stage).toUpperCase()==='PUBLISHED'?'ĐÃ XUẤT BẢN':fmt(r.report_stage)}</span></div><div class="pairs"><div class="pair"><small>TOP 1</small><strong>${pair(r.final_pairs,0)}</strong></div><div class="pair"><small>TOP 2</small><strong>${pair(r.final_pairs,1)}</strong></div></div><div class="codes"><div class="code">${code(r.final_codes,0)}</div><div class="code">${code(r.final_codes,1)}</div><div class="code">${code(r.final_codes,2)}</div><div class="code">${code(r.final_codes,3)}</div></div><div class="statusline"><span>Trạng thái kiểm định</span><b>${String(r.conclusion||'—').toUpperCase()==='ALLOW'?'ĐÃ XUẤT BẢN':fmt(r.conclusion)}</b></div></section>
      </section>
      <section class="section soft"><div class="wrap"><p class="kicker">Xếp hạng tham khảo</p><h2>Top 3 của mô hình</h2><p class="intro">Bản chia sẻ trình bày thứ hạng, tỷ lệ xuất hiện 60 ngày và khoảng cách hiện tại của từng cặp.</p><div class="rankbox"><div class="rankrow head"><span>Hạng</span><span>Cặp</span><span>Tỷ lệ 60 ngày</span><span>Khoảng cách</span></div>${top.map((x,i)=>`<div class="rankrow"><span class="rank">${x.rank||i+1}</span><span class="rankpair">${fmt(x.pair)}</span><span class="metric"><strong>${pct(x.hit_rate_60)}</strong><span>HitRate60</span></span><span class="metric"><strong>${fmt(x.gap)}</strong><span>Gap</span></span></div>`).join('')}</div></div></section>
      <section class="section"><div class="wrap"><p class="kicker">Kiểm tra trước xuất bản</p><h2>Audit tóm tắt</h2><p class="intro">Chỉ phát hành báo cáo khi dữ liệu hợp lệ và các kiểm tra cốt lõi đạt yêu cầu.</p><div class="audit"><div class="check"><span>Dữ liệu 27/27</span><b>${fmt(r.source_status)}</b></div><div class="check"><span>No look-ahead</span><b>${fmt(a.no_look_ahead)}</b></div><div class="check"><span>Tie audit</span><b>${fmt(a.tie_audit)}</b></div><div class="check"><span>Readback</span><b>${fmt(a.readback)}</b></div></div><div class="method"><p><strong>Phương pháp:</strong> ${fmt(r.method_id)} · ${fmt(r.active_config)}</p><p><strong>Nguyên tắc:</strong> sử dụng dữ liệu đến t−1, chấm đủ 45 cặp đảo, lấy đúng Top 1 và Top 2 theo công thức đã khóa.</p></div><div class="note"><strong>Lưu ý:</strong> Đây là báo cáo phân tích dữ liệu và kết quả mô hình. Thống kê lịch sử không bảo đảm kết quả kỳ tiếp theo.</div></div></section>
      <footer class="footer"><div class="wrap"><strong>MB 4SO</strong> · Báo cáo dữ liệu theo ngày · ${fmt(r.target_date)}</div></footer>`;
    };
    fetch('report-share-data.json',{cache:'no-store'}).then(x=>{if(!x.ok)throw new Error('Không đọc được dữ liệu');return x.json()}).then(render).catch(e=>{document.querySelector('#app').innerHTML=`<div class="wrap error">Không thể tải báo cáo: ${e.message}</div>`});
  </script>
</body>
</html>
