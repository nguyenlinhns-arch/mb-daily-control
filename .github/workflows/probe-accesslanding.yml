name: Probe ACCESSTRADE landing

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/probe-accesslanding.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch landing and extract direct Shopee affiliate products
        shell: bash
        run: |
          set -euo pipefail
          URL="https://nguyenlinhtkv_aul4jx.accesslanding.site/"
          curl -L --fail --silent --show-error --compressed \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36" \
            "$URL" -o landing.html
          python -m pip -q install beautifulsoup4
          python - <<'PY'
          from bs4 import BeautifulSoup
          from urllib.parse import urlparse, parse_qs, unquote
          import base64, html, json, re

          raw=open('landing.html',encoding='utf-8',errors='ignore').read()
          text=html.unescape(raw).replace('\\/','/')
          soup=BeautifulSoup(text,'html.parser')
          products=[]
          seen=set()
          for a in soup.find_all('a', href=True):
              href=a.get('href','')
              if 'go.isclix.com/deep_link' not in href or 'url_enc=' not in href:
                  continue
              q=parse_qs(urlparse(href).query)
              enc=(q.get('url_enc') or [''])[0]
              if not enc: continue
              try:
                  pad='='*((4-len(enc)%4)%4)
                  target=base64.b64decode(enc+pad).decode('utf-8','ignore')
                  target=unquote(target)
              except Exception:
                  continue
              if 'shopee.vn/' not in target or '-i.' not in target:
                  continue
              if target in seen: continue
              seen.add(target)
              parent=a
              for _ in range(6):
                  parent=parent.parent if parent and parent.parent else parent
                  if parent is None: break
                  if parent.find('img') and len(parent.get_text(' ',strip=True))>8:
                      break
              img=parent.find('img') if parent else None
              image=''
              if img:
                  image=img.get('data-src') or img.get('src') or ''
                  if image.startswith('//'): image='https:'+image
              label=' '.join((parent.get_text(' ',strip=True) if parent else a.get_text(' ',strip=True)).split())
              # Product slug gives a cleaner fallback name than landing UI noise.
              slug=target.split('shopee.vn/',1)[1].rsplit('-i.',1)[0]
              fallback=slug.replace('-',' ').strip()
              products.append({
                  'affiliate_url':href,
                  'target_url':target,
                  'image':image,
                  'landing_text':label[:300],
                  'fallback_name':fallback[:180],
              })
          print('=== TRACKING IDS ===')
          m=re.search(r'go\.isclix\.com/deep_link(?:/v\d+)?/(\d+)/(\d+)',text)
          print(json.dumps({'publisher_tracking_id':m.group(1) if m else '', 'offer_id':m.group(2) if m else ''},ensure_ascii=False))
          print('=== PRODUCT_JSON ===')
          for p in products[:20]: print(json.dumps(p,ensure_ascii=False))
          print('=== PRODUCT_COUNT ===',len(products))
          PY
