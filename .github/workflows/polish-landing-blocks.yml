name: Polish 4SO landing blocks

on:
  push:
    paths:
      - '.github/workflows/polish-landing-blocks.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Polish copy and icons
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('ai-methods/landing-v3.html')
          s=p.read_text(encoding='utf-8')

          reps={
            'Bản tin 4SO AI phân tích dữ liệu Xổ số Miền Bắc: 15.000+ lượt tính toán, 7 lớp phương pháp, lịch sử đối chiếu công khai. Gói từ 30.000đ.':'4SO AI thống kê Xổ số Miền Bắc bằng AI từ dữ liệu đã công bố: 15.000+ lượt tính toán, 7 lớp phương pháp và lịch sử đối chiếu công khai. Gói từ 30.000đ.',
            '4SO AI – Bản tin phân tích dữ liệu Xổ số Miền Bắc':'4SO AI – Thống kê Xổ số Miền Bắc bằng AI',
            'Bản tin theo ngày với 15.000+ lượt tính toán, 7 lớp phương pháp và lịch sử đối chiếu công khai. Gói từ 30.000đ.':'Thống kê Xổ số Miền Bắc bằng AI theo ngày với 15.000+ lượt tính toán, 7 lớp phương pháp và lịch sử đối chiếu công khai. Gói từ 30.000đ.',
            '<span>Bản tin phân tích dữ liệu</span>':'<span>Thống kê Xổ số Miền Bắc</span>',
            '<p class="eyebrow">4SO AI · Bản tin theo ngày</p><h1>Nhận bản tin AI 4SO<br>cho ngày <span data-date>--/--/----</span></h1>':'<p class="eyebrow">AI thống kê Xổ số Miền Bắc</p><h1>Thống kê Xổ số Miền Bắc<br>bằng AI</h1><p class="date-headline">Bản tin ngày <strong><span data-date>--/--/----</span></strong></p>',
            '<strong>Mỗi ngày hệ thống chỉ dùng kết quả đã công bố đến hết ngày hôm qua</strong>':'<strong>Mỗi ngày AI chỉ dùng kết quả Xổ số Miền Bắc đã công bố đến hết ngày hôm qua</strong>',
            '<li>Hai cặp Top 1 – Top 2 và bốn đầu ra của mô hình</li><li>Thống kê, backtest và lịch sử đối chiếu theo ngày</li><li>Không dùng kết quả tương lai; dữ liệu được khóa trước kỳ</li>':'<li>Hai cặp Top 1 – Top 2, tương ứng 4 số đầu ra</li><li>Thống kê lịch sử, kiểm định và hồ sơ đối chiếu</li><li>Dữ liệu khóa đến ngày hôm qua, không dùng kết quả tương lai</li>',
            'Một đợt kiểm định lịch sử 30 ngày':'Kết quả kiểm định lịch sử 30 ngày',
            '<p class="buy-kicker">Bắt đầu từ ngày <span data-date>--/--/----</span></p><h2>Chọn gói bản tin</h2>':'<p class="buy-kicker">Thống kê Xổ số Miền Bắc · <span data-date>--/--/----</span></p><h2>Chọn gói nhận bản tin</h2>',
            '<p class="kicker">Xem trước trước khi mua</p><h2>Mẫu một bản tin đã xuất bản</h2>':'<p class="kicker">Xem trước khi đăng ký</p><h2>Mẫu bản tin thống kê đã xuất bản</h2>',
            '<li>Top 1 + Top 2 và bốn đầu ra</li><li>Top 3, tỷ lệ 60 ngày và khoảng cách hiện tại</li><li>Audit tóm tắt và ngày khóa dữ liệu</li>':'<li>Top 1 + Top 2 và 4 số đầu ra</li><li>Top 3, tỷ lệ 60 ngày và khoảng cách hiện tại</li><li>Kiểm tra dữ liệu và ngày khóa trước kỳ</li>',
            'Đủ toàn bộ cặp đảo trong không gian canonical.':'Chấm đủ 45 cặp đảo theo cùng một công thức.',
            'Backtest, lịch sử và audit được lưu để đối chiếu.':'Kiểm định lịch sử và hồ sơ đối chiếu được lưu theo ngày.',
            '<section class="closing wrap"><p class="kicker">Bản tin 4SO AI</p>':'<section class="closing wrap"><p class="kicker">Thống kê Xổ số Miền Bắc · 4SO AI</p>',
            '<span>Bản tin dữ liệu theo ngày</span>':'<span>Thống kê Xổ số Miền Bắc</span>',
            '<div class="mobile"><div><span>Bản tin từ <span data-date>--/--/----</span></span>':'<div class="mobile"><div><span>Thống kê XSMB · từ <span data-date>--/--/----</span></span>',
            '<p class="kicker">Đăng ký bản tin 4SO AI</p><h2 id="dialog-title">Chọn gói bắt đầu từ <span data-date>--/--/----</span></h2>':'<p class="kicker">Thống kê Xổ số Miền Bắc · 4SO AI</p><h2 id="dialog-title">Chọn gói bản tin từ <span data-date>--/--/----</span></h2>'
          }
          for a,b in reps.items(): s=s.replace(a,b)

          old='''<section class="trust wrap"><div class="trust-grid"><article class="trust-item"><span class="trust-icon">D-1</span><div><strong>Khóa dữ liệu trước kỳ</strong><span>Bản tin ngày <span data-date>--/--/----</span> chỉ dùng dữ liệu đến <span data-lock>--/--/----</span>.</span></div></article><article class="trust-item"><span class="trust-icon">✓</span><div><strong>Có lịch sử đối chiếu</strong><span>Đầu ra cũ và kết quả thực tế được lưu để tự kiểm tra.</span></div></article><article class="trust-item"><span class="trust-icon">AI</span><div><strong>Không chỉ là 4 mã</strong><span>Bản tin gồm dữ liệu, kiểm định, xếp hạng và hồ sơ đối chiếu.</span></div></article></div></section>'''
          new='''<section class="trust wrap"><div class="trust-grid"><article class="trust-item"><span class="trust-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></span><div><strong>Dữ liệu XSMB khóa trước kỳ</strong><span>Bản tin ngày <span data-date>--/--/----</span> chỉ dùng dữ liệu đến <span data-lock>--/--/----</span>.</span></div></article><article class="trust-item"><span class="trust-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 7v5l3 2"/></svg></span><div><strong>Lịch sử đối chiếu công khai</strong><span>Đầu ra cũ và kết quả thực tế được lưu để người đọc tự kiểm tra.</span></div></article><article class="trust-item"><span class="trust-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 19V10"/><path d="M10 19V5"/><path d="M16 19v-7"/><path d="M3 19h18"/><path d="m18 4 .7 1.6L20.5 6l-1.8.7L18 8.5l-.7-1.8L15.5 6l1.8-.4z"/></svg></span><div><strong>Phân tích nhiều lớp</strong><span>Bản tin gồm xếp hạng, kiểm định và hồ sơ đối chiếu — không chỉ hiển thị 4 số.</span></div></article></div></section>'''
          s=s.replace(old,new)

          oldlegal='''<div class="legal-grid"><article class="legal-card"><h3>18+</h3><p>Chỉ dành cho người từ 18 tuổi trở lên.</p></article><article class="legal-card"><h3>Không nhận cược</h3><p>Không giữ tiền cược, không trả thưởng, không đặt cược thay.</p></article><article class="legal-card"><h3>Không tự gia hạn</h3><p>Các gói thanh toán một lần, hết kỳ thì dừng.</p></article><article class="legal-card"><h3>Hoàn phí khi lỗi dịch vụ</h3><p>Nếu không thể cung cấp bản tin do lỗi phía dịch vụ, phí tương ứng được hoàn lại.</p></article></div>'''
          newlegal='''<div class="legal-grid"><article class="legal-card"><span class="legal-icon legal-icon-text" aria-hidden="true">18+</span><h3>Chỉ dành cho 18+</h3><p>Dịch vụ chỉ dành cho người từ 18 tuổi trở lên.</p></article><article class="legal-card"><span class="legal-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M6.5 6.5 17.5 17.5"/></svg></span><h3>Không nhận cược</h3><p>Không giữ tiền cược, không trả thưởng, không đặt cược thay.</p></article><article class="legal-card"><span class="legal-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20 7h-6V1"/><path d="M20 7a8 8 0 1 0 1 8"/><path d="M4 17h6v6"/></svg></span><h3>Không tự gia hạn</h3><p>Các gói thanh toán một lần; hết kỳ thì dừng.</p></article><article class="legal-card"><span class="legal-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 10a8 8 0 1 1 2.3 7.7"/><path d="M4 4v6h6"/><path d="m9 13 2 2 4-4"/></svg></span><h3>Hoàn phí khi lỗi dịch vụ</h3><p>Nếu không thể cung cấp bản tin do lỗi phía dịch vụ, phí tương ứng được hoàn lại.</p></article></div>'''
          s=s.replace(oldlegal,newlegal)

          css='''.date-headline{margin:11px 0 0;color:#536873;font-size:15px}.date-headline strong{color:var(--orange);font-size:18px}.trust-icon svg,.legal-icon svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.legal-icon{width:38px;height:38px;display:grid;place-items:center;margin-bottom:11px;border-radius:11px;background:var(--soft);color:var(--navy)}.legal-icon-text{font-size:11px;font-weight:900}.sample-top b{display:inline-flex;align-items:center;gap:4px}.sample-top b::before{content:"✓";font-size:10px}.package.active::after,.modal-package.active::after{content:"✓";position:absolute;bottom:5px;right:7px;color:var(--lime);font-size:10px;font-weight:900}.modal-package{position:relative}.modal-package.active::after{color:var(--navy)}'''
          if '.trust-icon svg' not in s:
              s=s.replace('    @media(max-width:420px)', '    '+css+'\n    @media(max-width:420px)')

          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify
        run: |
          grep -n 'Thống kê Xổ số Miền Bắc' ai-methods/landing-v3.html | head
          grep -n 'Xem trước khi đăng ký' ai-methods/landing-v3.html
          grep -n 'trust-icon.*svg' ai-methods/landing-v3.html | head
          grep -n 'legal-icon' ai-methods/landing-v3.html | head
      - name: Commit
        run: |
          if git diff --quiet -- ai-methods/landing-v3.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai-methods/landing-v3.html
          git commit -m 'Polish landing copy icons and blocks'
          git push origin HEAD:main
