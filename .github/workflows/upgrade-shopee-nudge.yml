name: Upgrade Shopee nudge creative

on:
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/upgrade-shopee-nudge.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add product image to Shopee nudge
        run: |
          python scripts/patch_shopee_nudge_creative.py
          node --check site-v2/checkout-enhance.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site-v2/checkout-enhance.js
          git commit -m 'Show product image in Shopee nudge'
          git push origin HEAD:main
